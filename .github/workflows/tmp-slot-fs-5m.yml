name: Temp Slot FS 5M

on:
  push:
    branches:
      - tmp/slot-fs-5m-20260926-v2

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Verify slot config
        run: |
          grep -E "BONUS_INITIAL_PAIR_COPY_CHANCE|BONUS_REFILL_PAIR_COPY_CHANCE|BONUS_THIRD_REPEAT_WEIGHT_FACTOR|BONUS_INITIAL_CORE_CHANCE|BONUS_REFILL_CORE_CHANCE" artifacts/cascade-8/src/config/GameConfig.ts
      - name: Typecheck
        run: pnpm run typecheck
      - name: Run 5M simulation
        run: pnpm --filter @workspace/cascade-8 run simulate -- --spins=5000000 --seed=fs-deep-5m-20260926-v2
      - name: Print saved report
        if: always()
        run: |
          latest="$(find simulation-results -maxdepth 1 -type f -name '*.json' 2>/dev/null | sort | tail -1)"
          if [ -n "$latest" ]; then
            echo "REPORT_FILE=$latest"
            cat "$latest"
          fi
