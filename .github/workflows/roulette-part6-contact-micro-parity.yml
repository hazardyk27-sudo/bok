name: Roulette Part 6 Contact Micro Parity

on:
  push:
    branches:
      - feature/roulette
    paths:
      - '.github/workflows/roulette-part6-contact-micro-parity.yml'
      - 'artifacts/roulette-physics-lab/src/Part2SceneViewport.tsx'
      - 'artifacts/api-server/src/physics-lab/simulation.ts'
      - 'artifacts/cascade-8/src/roulettePhysicsConfig.test.ts'
  workflow_dispatch:

jobs:
  micro-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build TypeScript project references
        run: pnpm run typecheck:libs

      - name: Typecheck physics runtimes
        run: |
          pnpm --filter @workspace/roulette-physics-lab run typecheck
          pnpm --filter @workspace/api-server run typecheck

      - name: Run Part 6 source contract test
        run: PORT=4173 BASE_PATH=/ pnpm --filter @workspace/cascade-8 exec vitest run src/roulettePhysicsConfig.test.ts

      - name: Start roulette physics lab
        shell: bash
        run: |
          PORT=4173 BASE_PATH=/ pnpm --filter @workspace/roulette-physics-lab run dev > /tmp/roulette-part6-micro-vite.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/roulette-part6-micro-vite.log
          exit 1

      - name: Verify browser five-seed contact micro parity
        shell: bash
        run: |
          set -euo pipefail
          ROULETTE_LAB_URL="http://127.0.0.1:4173/?part6Headless=1&part6SeedStartIndex=0&part6SeedCount=5&part6MaxDurationSeconds=30" \
          ROULETTE_PART6_OUTPUT="artifacts/roulette-physics-lab/part6-micro-browser.json" \
          ROULETTE_PART6_TIMEOUT_MS='240000' \
          ROULETTE_PART6_EXPECTED_SEEDS='5' \
          node scripts/roulette-part6-runtime.mjs > part6-micro-browser.log 2>&1

          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(
            fs.readFileSync('artifacts/roulette-physics-lab/part6-micro-browser.json', 'utf8'),
          );
          const rows = data.telemetry?.results ?? data.seedTelemetry ?? [];
          if (rows.length !== 5) throw new Error('Expected five browser micro-parity rows');

          for (const row of rows) {
            const out = {
              seed: row.seed,
              stationarySamples: row.microParityStationarySamples,
              rotorSamples: row.microParityRotorSamples,
              maxPointDeltaWorld: row.microParityMaxPointDeltaWorld,
              maxNormalAngleDegrees: row.microParityMaxNormalAngleDegrees,
              maxClearanceDeltaWorld: row.microParityMaxClearanceDeltaWorld,
              microParityPassed: row.microParityPassed,
              settled: row.settled,
              safetyPassed: row.safetyPassed,
            };
            console.log('PART6_BROWSER_MICRO_CASE ' + JSON.stringify(out));
            if (!row.microParityPassed) throw new Error(row.seed + ' browser micro parity failed');
            if (row.microParityStationarySamples < 1 || row.microParityRotorSamples < 1) {
              throw new Error(row.seed + ' browser contact sample coverage missing');
            }
            if (row.microParityMaxPointDeltaWorld > 0.0006) {
              throw new Error(row.seed + ' browser point delta exceeded tolerance');
            }
            if (row.microParityMaxNormalAngleDegrees > 0.1) {
              throw new Error(row.seed + ' browser normal delta exceeded tolerance');
            }
            if (row.microParityMaxClearanceDeltaWorld > 0.0006) {
              throw new Error(row.seed + ' browser clearance delta exceeded tolerance');
            }
            if (!row.settled || !row.safetyPassed) {
              throw new Error(row.seed + ' browser regression failed');
            }
          }
          console.log('PART6_BROWSER_MICRO_PASS ' + JSON.stringify({
            seeds: rows.map(row => row.seed),
            allPassed: true,
          }));
          NODE

      - name: Verify server five-seed contact micro parity
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @workspace/api-server exec tsx -e \
            "(async () => {
              const { simulatePhysicsLabRound } = await import('./src/physics-lab/simulation.ts');
              const seeds = ['61001','61002','61003','61004','61005'];
              for (const seed of seeds) {
                const row = await simulatePhysicsLabRound('part6-micro-' + seed, seed);
                const out = {
                  seed,
                  status: row.status,
                  stationarySamples: row.microParityStationarySamples,
                  rotorSamples: row.microParityRotorSamples,
                  maxPointDeltaWorld: row.microParityMaxPointDeltaWorld,
                  maxNormalAngleDegrees: row.microParityMaxNormalAngleDegrees,
                  maxClearanceDeltaWorld: row.microParityMaxClearanceDeltaWorld,
                  microParityPassed: row.microParityPassed,
                };
                console.log('PART6_SERVER_MICRO_CASE ' + JSON.stringify(out));
                if (!row.microParityPassed) throw new Error(seed + ' server micro parity failed');
                if (row.microParityStationarySamples < 1 || row.microParityRotorSamples < 1) {
                  throw new Error(seed + ' server contact sample coverage missing');
                }
                if (row.microParityMaxPointDeltaWorld > 0.0006) {
                  throw new Error(seed + ' server point delta exceeded tolerance');
                }
                if (row.microParityMaxNormalAngleDegrees > 0.1) {
                  throw new Error(seed + ' server normal delta exceeded tolerance');
                }
                if (row.microParityMaxClearanceDeltaWorld > 0.0006) {
                  throw new Error(seed + ' server clearance delta exceeded tolerance');
                }
              }
              console.log('PART6_SERVER_MICRO_PASS ' + JSON.stringify({ seeds, allPassed: true }));
            })().catch((error) => { console.error(error); process.exit(1); });" \
            > part6-micro-server.log 2>&1
          cat part6-micro-server.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roulette-part6-contact-micro-parity
          path: |
            artifacts/roulette-physics-lab/part6-micro-browser.json
            part6-micro-browser.log
            part6-micro-server.log
            /tmp/roulette-part6-micro-vite.log
          if-no-files-found: warn
