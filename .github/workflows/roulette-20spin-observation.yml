name: Roulette 20 Spin Observation

on:
  push:
    branches:
      - feature/roulette
    paths:
      - '.github/workflows/roulette-20spin-observation.yml'
  workflow_dispatch:

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        start: [0, 5, 10, 15]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build TypeScript project references
        run: pnpm run typecheck:libs

      - name: Typecheck roulette physics lab
        run: pnpm --filter @workspace/roulette-physics-lab run typecheck

      - name: Start roulette physics lab
        shell: bash
        run: |
          PORT=4173 BASE_PATH=/ pnpm --filter @workspace/roulette-physics-lab run dev > /tmp/roulette-20spin-vite-${{ matrix.start }}.log 2>&1 &
          echo $! > /tmp/roulette-20spin-vite-${{ matrix.start }}.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/roulette-20spin-vite-${{ matrix.start }}.log
          exit 1

      - name: Run five-spin observation
        env:
          START_INDEX: ${{ matrix.start }}
          ROULETTE_PART6_TIMEOUT_MS: '240000'
        shell: bash
        run: |
          set +e
          ROULETTE_LAB_URL="http://127.0.0.1:4173/?part6Headless=1&part6SeedStartIndex=$START_INDEX&part6SeedCount=5&part6MaxDurationSeconds=30" \
          ROULETTE_PART6_OUTPUT="artifacts/roulette-physics-lab/obs20-$START_INDEX.json" \
          ROULETTE_PART6_EXPECTED_SEEDS='5' \
          node scripts/roulette-part6-runtime.mjs > "obs20-$START_INDEX.log" 2>&1
          runtime_rc=$?
          set -e
          cat "obs20-$START_INDEX.log"
          node - "$START_INDEX" <<'NODE'
          const fs = require('fs');
          const start = process.argv[2];
          const path = 'artifacts/roulette-physics-lab/obs20-' + start + '.json';
          if (!fs.existsSync(path)) {
            console.log('OBS20_BATCH_ERROR ' + JSON.stringify({start, error:'missing output'}));
            process.exit(0);
          }
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          const results = data.telemetry?.results ?? data.seedTelemetry ?? [];
          for (const result of results) {
            const safetyIssues = [
              result.escaped ? 'ESCAPED' : null,
              result.clipping ? 'CLIPPING' : null,
              result.tunneling ? 'TUNNELING' : null,
              result.velocitySpike ? 'VELOCITY_SPIKE' : null,
              result.artificialAcceleration ? 'ARTIFICIAL_ACCELERATION' : null,
            ].filter(Boolean);
            let classification = 'UNSETTLED_OTHER';
            if (safetyIssues.length) classification = 'SAFETY_ERROR';
            else if (result.settled && result.finalPocketNumber == null) classification = 'SETTLED_NULL_NUMBER';
            else if (result.settled && result.finalPocketNumber != null) classification = 'SETTLED_VALID';
            else if (result.timedOut) classification = 'TIMEOUT';
            console.log('OBS20_CASE ' + JSON.stringify({
              seed: result.seed,
              classification,
              number: result.finalPocketNumber ?? null,
              pocketIndex: result.finalPocketIndex ?? null,
              laps: result.lapCount ?? null,
              settled: !!result.settled,
              timedOut: !!result.timedOut,
              settleTime: result.settleTime ?? null,
              finalSpeed: result.finalSpeed ?? null,
              finalRotorRelativeSpeed: result.finalRotorRelativeSpeed ?? null,
              safetyIssues,
              escaped: !!result.escaped,
              clipping: !!result.clipping,
              tunneling: !!result.tunneling,
              velocitySpike: !!result.velocitySpike,
              artificialAcceleration: !!result.artificialAcceleration,
              safetyPassed: !!result.safetyPassed,
              detail: result.detail ?? null
            }));
          }
          console.log('OBS20_BATCH_SUMMARY ' + JSON.stringify({
            startIndex:Number(start),
            captured:results.length,
            seeds:results.map(x=>x.seed)
          }));
          NODE
          echo "OBS20_RUNTIME_EXIT_CODE=$runtime_rc"

      - name: Upload five-spin evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roulette-20spin-observation-${{ matrix.start }}
          path: |
            artifacts/roulette-physics-lab/obs20-${{ matrix.start }}.json
            obs20-${{ matrix.start }}.log
            /tmp/roulette-20spin-vite-${{ matrix.start }}.log
          if-no-files-found: warn
