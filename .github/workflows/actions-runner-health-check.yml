name: Actions Runner Health Check

on:
  push:
    branches:
      - feature/roulette
    paths:
      - '.github/workflows/actions-runner-health-check.yml'
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Runner alive
        run: echo "RUNNER_HEALTH_OK"
