name: Actions Slim Runner Health Check

on:
  push:
    branches:
      - feature/roulette
    paths:
      - '.github/workflows/actions-slim-health-check.yml'
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Runner alive
        run: echo "SLIM_RUNNER_HEALTH_OK"
