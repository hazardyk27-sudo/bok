name: Roulette Part 11 Direct Wall Hug Probe

on:
  push:
    branches:
      - feature/roulette
    paths:
      - '.github/workflows/roulette-part11-direct-wall-hug-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        speed: ['5.00', '5.50', '6.00']

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: Apply test-only direct wall-hug placement
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path("artifacts/roulette-physics-lab/src/Part2SceneViewport.tsx")
          text = path.read_text()
          anchor = "          // Flush the previous seed's dynamic state and contact manifold before"
          insert = """          if (
            part11Calibration &&
            part6Params.get('part11DirectWallHug') === '1'
          ) {
            // Test-only: tangent to the outer-race floor and steep wall.
            const wallHugCenterRadius = 2.51636415;
            const wallHugCenterY = -0.24343675;
            launchPosition.set(
              Math.sin(activeLaunchAzimuth) * wallHugCenterRadius,
              wallHugCenterY,
              Math.cos(activeLaunchAzimuth) * wallHugCenterRadius,
            );
            launchVelocity.set(
              Math.cos(activeLaunchAzimuth) * activeLaunchSpeed,
              0,
              -Math.sin(activeLaunchAzimuth) * activeLaunchSpeed,
            );
            const supportNormal = part2ChannelNormalAt(
              2.54,
              activeLaunchAzimuth,
            );
            launchAngularVelocity
              .copy(supportNormal)
              .cross(launchVelocity)
              .multiplyScalar(activePart11SpinFactor / BALL_RADIUS);
            console.info(
              'PART11_DIRECT_WALL_HUG_START',
              JSON.stringify({
                seed: run.seed,
                centerRadius: wallHugCenterRadius,
                centerY: wallHugCenterY,
                ballRadius: BALL_RADIUS,
                radialVelocity: 0,
                launchSpeed: activeLaunchSpeed,
              }),
            );
          }

"""
          if anchor not in text:
              raise SystemExit("launch-state insertion anchor not found")
          path.write_text(text.replace(anchor, insert + anchor, 1))
          PY

      - run: pnpm run typecheck:libs
      - run: pnpm --filter @workspace/roulette-physics-lab run typecheck

      - name: Start physics lab
        run: |
          PORT=4173 BASE_PATH=/ pnpm --filter @workspace/roulette-physics-lab run dev > /tmp/roulette-part11-direct-wallhug-${{ matrix.speed }}.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/roulette-part11-direct-wallhug-${{ matrix.speed }}.log
          exit 1

      - name: Run two difficult seeds
        env:
          SPEED: ${{ matrix.speed }}
        shell: bash
        run: |
          set -u
          : > "part11-direct-wallhug-${SPEED}.ndjson"
          for spec in 61007:6 61014:13; do
            SEED="${spec%%:*}"
            START="${spec##*:}"
            OUT="part11-direct-wallhug-${SPEED}-${SEED}.json"
            LOG="part11-direct-wallhug-${SPEED}-${SEED}.log"

            ROULETTE_LAB_URL="http://127.0.0.1:4173/?part6Headless=1&part6SeedStartIndex=${START}&part6SeedCount=1&part6MaxDurationSeconds=30&part11Calibration=1&part11DirectWallHug=1&part11LaunchRadius=2.39&part11LaunchSpeedMps=${SPEED}&part11BallScale=0.70&part11SpinFactor=1.0&part11TrackFriction=0.028" \
            ROULETTE_PART6_OUTPUT="${OUT}" \
            ROULETTE_PART6_TIMEOUT_MS='150000' \
            ROULETTE_PART6_EXPECTED_SEEDS='1' \
            node scripts/roulette-part6-runtime.mjs > "${LOG}" 2>&1 || true

            node - "${LOG}" "${SEED}" "${OUT}" "${SPEED}" <<'NODE' | tee -a "part11-direct-wallhug-${SPEED}.ndjson"
          const fs=require('fs');
          const [logPath,seed,outPath,speed]=process.argv.slice(2);
          let start=null;
          const frames=[];
          if(fs.existsSync(logPath)){
            for(const line of fs.readFileSync(logPath,'utf8').split(/\n+/)){
              const marker='BROWSER_CONSOLE ';
              const at=line.indexOf(marker);
              if(at<0) continue;
              try{
                const outer=JSON.parse(line.slice(at+marker.length));
                const text=String(outer.text??'');
                if(text.startsWith('PART11_DIRECT_WALL_HUG_START ')){
                  start=JSON.parse(text.slice('PART11_DIRECT_WALL_HUG_START '.length));
                }
                if(text.startsWith('ROULETTE_PARITY_STEP ')){
                  frames.push(JSON.parse(text.slice('ROULETTE_PARITY_STEP '.length)));
                }
              }catch{}
            }
          }
          let row=null;
          if(fs.existsSync(outPath)){
            const data=JSON.parse(fs.readFileSync(outPath,'utf8'));
            row=(data.telemetry?.results ?? data.seedTelemetry ?? [])[0] ?? null;
          }
          const first=frames[0]??null;
          console.log(JSON.stringify({
            speedMps:Number(speed),
            seed:Number(seed),
            telemetry:Boolean(row),
            start,
            firstStep:first?{
              step:first.step,
              radius:first.radius,
              radialVelocity:first.radialVelocity,
              speed:first.speed,
              y:first.position?.y ?? null
            }:null,
            lapCount:row?.lapCount ?? null,
            trackDuration:row?.trackDuration ?? null,
            inwardTransitionTime:row?.inwardTransitionTime ?? null,
            maxRadius:row?.maxRadius ?? null,
            settled:row?.settled ?? null,
            timedOut:row?.timedOut ?? null,
            safetyPassed:row?.safetyPassed ?? null,
            escaped:row?.escaped ?? null,
            clipping:row?.clipping ?? null,
            tunneling:row?.tunneling ?? null,
            velocitySpike:row?.velocitySpike ?? null,
            artificialAcceleration:row?.artificialAcceleration ?? null,
            finalPocketNumber:row?.finalPocketNumber ?? null
          }));
          NODE
          done

      - name: Summarize direct wall-hug speed
        env:
          SPEED: ${{ matrix.speed }}
        run: |
          node <<'NODE'
          const fs=require('fs');
          const speed=process.env.SPEED;
          const rows=fs.readFileSync('part11-direct-wallhug-'+speed+'.ndjson','utf8')
            .trim().split(/\n+/).filter(Boolean).map(JSON.parse);
          if(rows.length!==2 || rows.some(r=>!r.telemetry || !r.start)) {
            throw new Error(speed+': expected 2 telemetry/start rows');
          }
          console.log('PART11_DIRECT_WALL_HUG_SUMMARY '+JSON.stringify({
            speedMps:Number(speed),
            minLap:Math.min(...rows.map(r=>Number(r.lapCount))),
            maxLap:Math.max(...rows.map(r=>Number(r.lapCount))),
            allSafe:rows.every(r=>
              r.settled && !r.timedOut && r.safetyPassed &&
              !r.escaped && !r.clipping && !r.tunneling &&
              !r.velocitySpike && !r.artificialAcceleration &&
              r.finalPocketNumber!=null
            ),
            rows
          }));
          NODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roulette-part11-direct-wallhug-${{ matrix.speed }}
          path: |
            part11-direct-wallhug-${{ matrix.speed }}*
            /tmp/roulette-part11-direct-wallhug-${{ matrix.speed }}.log
          if-no-files-found: warn
