name: Roulette Exact GLB Collider Sync

on:
  push:
    branches:
      - feature/roulette
    paths:
      - '.github/workflows/roulette-exact-glb-collider-sync.yml'
      - 'artifacts/roulette-physics-lab/public/rou-lp-test-04.glb'
      - 'artifacts/roulette-physics-lab/scripts/generate-exact-collider-data.mjs'
      - 'lib/roulette-gltf-transform.ts'
      - 'lib/roulette-physics-config.ts'
      - 'lib/roulette-pocket-mapping.ts'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature/roulette
        uses: actions/checkout@v4
        with:
          ref: feature/roulette
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Generate exact GLB collider payload
        run: pnpm exec tsx artifacts/roulette-physics-lab/scripts/generate-exact-collider-data.mjs

      - name: Verify generated payload exists
        run: |
          test -s artifacts/api-server/src/physics-lab/glbColliderData.ts
          git diff --stat
          git diff --check

      - name: Commit generated collider payload when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The generated payload is intentionally not a hand-authored source
          # file and may match a broad ignore rule. Force-stage it first so an
          # untracked first generation cannot be mistaken for a clean diff.
          git add -f artifacts/api-server/src/physics-lab/glbColliderData.ts
          if git diff --cached --quiet -- artifacts/api-server/src/physics-lab/glbColliderData.ts; then
            echo "Exact GLB collider payload already current."
            exit 0
          fi
          git commit -m "physics: sync exact GLB collider payload"
          git push origin HEAD:feature/roulette
