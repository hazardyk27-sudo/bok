name: Roulette 5 Seed Lap Calibration Gate

on:
  push:
    branches:
      - feature/roulette
    paths:
      - '.github/workflows/roulette-5seed-lap-calibration.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  lap-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed: 61007
            start: 6
          - seed: 61014
            start: 13
          - seed: 61011
            start: 10
          - seed: 61009
            start: 8
          - seed: 61012
            start: 11

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build TypeScript project references
        run: pnpm run typecheck:libs

      - name: Typecheck roulette physics lab
        run: pnpm --filter @workspace/roulette-physics-lab run typecheck

      - name: Start roulette physics lab
        shell: bash
        run: |
          PORT=4173 BASE_PATH=/ pnpm --filter @workspace/roulette-physics-lab run dev > /tmp/roulette-lap-${{ matrix.seed }}.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/roulette-lap-${{ matrix.seed }}.log
          exit 1

      - name: Verify five-lap seed
        env:
          SEED: ${{ matrix.seed }}
          START_INDEX: ${{ matrix.start }}
        shell: bash
        run: |
          set -euo pipefail
          ROULETTE_LAB_URL="http://127.0.0.1:4173/?part6Headless=1&part6SeedStartIndex=$START_INDEX&part6SeedCount=1&part6MaxDurationSeconds=20" \
          ROULETTE_PART6_OUTPUT="artifacts/roulette-physics-lab/lap-gate-$SEED.json" \
          ROULETTE_PART6_TIMEOUT_MS='120000' \
          ROULETTE_PART6_EXPECTED_SEEDS='1' \
          node scripts/roulette-part6-runtime.mjs > "lap-gate-$SEED.log" 2>&1

          node - "$SEED" <<'NODE'
          const fs = require('fs');
          const seed = Number(process.argv[2]);
          const data = JSON.parse(fs.readFileSync(
            'artifacts/roulette-physics-lab/lap-gate-' + seed + '.json',
            'utf8',
          ));
          const rows = data.telemetry?.results ?? data.seedTelemetry ?? [];
          if (rows.length !== 1) throw new Error('Expected one result for ' + seed);
          const row = rows[0];
          const out = {
            seed: row.seed,
            launchSpeedMetersPerSecond: row.launchSpeedMetersPerSecond,
            settled: row.settled,
            timedOut: row.timedOut,
            finalPocketNumber: row.finalPocketNumber,
            lapCount: row.lapCount,
            settleTime: row.settleTime,
            finalRotorRelativeSpeed: row.finalRotorRelativeSpeed,
            peakSpeed: row.peakSpeed,
            velocitySpike: row.velocitySpike,
            artificialAcceleration: row.artificialAcceleration,
            escaped: row.escaped,
            clipping: row.clipping,
            tunneling: row.tunneling,
            safetyPassed: row.safetyPassed,
          };
          console.log('LAP_CALIBRATION_CASE ' + JSON.stringify(out));
          if (!row.settled || row.timedOut) throw new Error(seed + ' did not settle');
          if (row.finalPocketNumber == null) throw new Error(seed + ' missing pocket result');
          if (row.lapCount < 5) throw new Error(seed + ' below five laps: ' + row.lapCount);
          if (row.velocitySpike || row.artificialAcceleration) throw new Error(seed + ' spike/artificial acceleration');
          if (row.escaped || row.clipping || row.tunneling) throw new Error(seed + ' containment failure');
          NODE


      - name: Publish lap status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEED: ${{ matrix.seed }}
        shell: bash
        run: |
          node - "$SEED" <<'NODE'
          const fs = require('fs');
          const seed = Number(process.argv[2]);
          const path = 'artifacts/roulette-physics-lab/lap-gate-' + seed + '.json';
          let state = 'failure';
          let description = 'seed ' + seed + ': telemetry missing';
          if (fs.existsSync(path)) {
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            const rows = data.telemetry?.results ?? data.seedTelemetry ?? [];
            const row = rows[0];
            if (row) {
              const ok = Boolean(
                row.settled &&
                !row.timedOut &&
                row.finalPocketNumber != null &&
                row.lapCount >= 5 &&
                !row.velocitySpike &&
                !row.artificialAcceleration &&
                !row.escaped &&
                !row.clipping &&
                !row.tunneling
              );
              state = ok ? 'success' : 'failure';
              const lap = Number.isFinite(Number(row.lapCount))
                ? Number(row.lapCount).toFixed(3)
                : 'n/a';
              description =
                'seed ' + seed +
                ': lap=' + lap +
                ' settled=' + Boolean(row.settled) +
                ' safety=' + Boolean(row.safetyPassed);
            }
          }
          const body = {
            state,
            context: 'roulette/lap-' + seed,
            description: description.slice(0, 140),
            target_url:
              'https://github.com/' +
              process.env.GITHUB_REPOSITORY +
              '/actions/runs/' +
              process.env.GITHUB_RUN_ID,
          };
          fs.writeFileSync('/tmp/lap-status.json', JSON.stringify(body));
          NODE

          curl --fail-with-body --silent --show-error             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"             --data-binary @/tmp/lap-status.json

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roulette-lap-calibration-${{ matrix.seed }}
          path: |
            artifacts/roulette-physics-lab/lap-gate-${{ matrix.seed }}.json
            lap-gate-${{ matrix.seed }}.log
            /tmp/roulette-lap-${{ matrix.seed }}.log
          if-no-files-found: warn
