name: Roulette Part 9 Calibration Sweep

on:
  push:
    branches:
      - feature/roulette
    paths:
      - '.github/workflows/roulette-part9-calibration-sweep.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build TypeScript project references
        run: pnpm run typecheck:libs

      - name: Typecheck roulette physics lab
        run: pnpm --filter @workspace/roulette-physics-lab run typecheck

      - name: Start roulette physics lab
        run: |
          PORT=4173 BASE_PATH=/ pnpm --filter @workspace/roulette-physics-lab run dev > /tmp/roulette-part9-sweep-vite.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/roulette-part9-sweep-vite.log
          exit 1

      - name: Sweep radius and speed on seed 61007
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/roulette-physics-lab/part9-sweep
          : > part9-sweep-results.ndjson

          for radius in 2.39 2.45 2.49 2.52; do
            for speed in 5.0 6.0 7.0 8.0; do
              tag="r${radius}-s${speed}"
              echo "PART9_SWEEP_START radius=$radius speed=$speed"
              ROULETTE_LAB_URL="http://127.0.0.1:4173/?part6Headless=1&part6SeedStartIndex=6&part6SeedCount=1&part6MaxDurationSeconds=20&part9Calibration=1&part9LaunchRadius=$radius&part9LaunchSpeedMps=$speed" \
              ROULETTE_PART6_OUTPUT="artifacts/roulette-physics-lab/part9-sweep/$tag.json" \
              ROULETTE_PART6_TIMEOUT_MS='120000' \
              ROULETTE_PART6_EXPECTED_SEEDS='1' \
              node scripts/roulette-part6-runtime.mjs > "part9-sweep-$tag.log" 2>&1 || true

              node - "$radius" "$speed" "$tag" <<'NODE'
              const fs = require('fs');
              const radius = Number(process.argv[2]);
              const speed = Number(process.argv[3]);
              const tag = process.argv[4];
              const path = 'artifacts/roulette-physics-lab/part9-sweep/' + tag + '.json';
              let out = { radius, speed, telemetry: false };
              if (fs.existsSync(path)) {
                const data = JSON.parse(fs.readFileSync(path, 'utf8'));
                const row = (data.telemetry?.results ?? data.seedTelemetry ?? [])[0];
                if (row) {
                  out = {
                    radius,
                    speed,
                    telemetry: true,
                    seed: row.seed,
                    lapCount: row.lapCount,
                    trackDuration: row.trackDuration,
                    trackStartSpeed: row.trackStartSpeed,
                    trackEndSpeed: row.trackEndSpeed,
                    settleTime: row.settleTime,
                    settled: row.settled,
                    timedOut: row.timedOut,
                    safetyPassed: row.safetyPassed,
                    escaped: row.escaped,
                    clipping: row.clipping,
                    tunneling: row.tunneling,
                    velocitySpike: row.velocitySpike,
                    artificialAcceleration: row.artificialAcceleration,
                    finalPocketNumber: row.finalPocketNumber,
                  };
                }
              }
              fs.appendFileSync('part9-sweep-results.ndjson', JSON.stringify(out) + '\n');
              console.log('PART9_SWEEP_CASE ' + JSON.stringify(out));
              NODE
            done
          done

      - name: Rank viable candidates
        run: |
          node <<'NODE'
          const fs = require('fs');
          const rows = fs.readFileSync('part9-sweep-results.ndjson', 'utf8')
            .trim().split(/\n+/).filter(Boolean).map(JSON.parse);
          const viable = rows.filter(row =>
            row.telemetry &&
            row.settled &&
            !row.timedOut &&
            row.safetyPassed &&
            !row.escaped &&
            !row.clipping &&
            !row.tunneling &&
            !row.velocitySpike &&
            !row.artificialAcceleration
          ).map(row => ({
            ...row,
            targetDistance: Math.abs(row.lapCount - 4.5),
            inTargetBand: row.lapCount >= 4 && row.lapCount <= 5,
          })).sort((a,b) =>
            Number(b.inTargetBand) - Number(a.inTargetBand) ||
            a.targetDistance - b.targetDistance
          );
          console.log('PART9_SWEEP_RANKED ' + JSON.stringify(viable));
          fs.writeFileSync('part9-sweep-ranked.json', JSON.stringify(viable, null, 2));
          if (viable.length === 0) throw new Error('No safe calibration candidate');
        NODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roulette-part9-calibration-sweep
          path: |
            artifacts/roulette-physics-lab/part9-sweep/
            part9-sweep-results.ndjson
            part9-sweep-ranked.json
            part9-sweep-*.log
            /tmp/roulette-part9-sweep-vite.log
          if-no-files-found: warn
