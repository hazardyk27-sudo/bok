name: Roulette Part 7 Natural Inward Descent

on:
  push:
    branches:
      - feature/roulette
    paths:
      - '.github/workflows/roulette-part7-natural-inward-descent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript project references
        run: pnpm run typecheck:libs

      - name: Typecheck physics runtimes
        run: |
          pnpm --filter @workspace/roulette-physics-lab run typecheck
          pnpm --filter @workspace/api-server run typecheck

      - name: Prove no scripted ball motion inside simulation loops
        run: |
          node <<'NODE'
          const fs = require('fs');
          const browser = fs.readFileSync(
            'artifacts/roulette-physics-lab/src/Part2SceneViewport.tsx',
            'utf8',
          );
          const server = fs.readFileSync(
            'artifacts/api-server/src/physics-lab/simulation.ts',
            'utf8',
          );

          const browserStart = browser.indexOf(
            'for (let step = 0; step < maxSteps; step += 1) {',
          );
          const browserEnd = browser.indexOf(
            'const finalPosition = activeBallBody.translation();',
            browserStart,
          );
          if (browserStart < 0 || browserEnd < 0) {
            throw new Error('Browser full-spin loop bounds not found');
          }
          const browserLoop = browser.slice(browserStart, browserEnd);

          const serverStart = server.indexOf(
            'for (let step = 0; step < durationLimitSteps; step += 1) {',
          );
          const serverEnd = server.indexOf('} catch (error) {', serverStart);
          if (serverStart < 0 || serverEnd < 0) {
            throw new Error('Server simulation loop bounds not found');
          }
          const serverLoop = server.slice(serverStart, serverEnd);

          const forbiddenBrowser = [
            'activeBallBody.setTranslation(',
            'activeBallBody.setLinvel(',
            'activeBallBody.setAngvel(',
            'activeBallBody.applyImpulse(',
            'activeBallBody.addForce(',
            'activeBallBody.addTorque(',
          ];
          const forbiddenServer = [
            'ballBody.setTranslation(',
            'ballBody.setLinvel(',
            'ballBody.setAngvel(',
            'ballBody.applyImpulse(',
            'ballBody.addForce(',
            'ballBody.addTorque(',
          ];

          for (const token of forbiddenBrowser) {
            if (browserLoop.includes(token)) {
              throw new Error('Scripted browser ball motion found in loop: ' + token);
            }
          }
          for (const token of forbiddenServer) {
            if (serverLoop.includes(token)) {
              throw new Error('Scripted server ball motion found in loop: ' + token);
            }
          }

          if (!browserLoop.includes("'INWARD_DESCENT'")) {
            throw new Error('Browser natural inward descent phase missing');
          }
          if (!serverLoop.includes('"NATURAL_INWARD_EXIT"')) {
            throw new Error('Server natural inward exit event missing');
          }

          console.log('PART7_SOURCE_CONTRACT ' + JSON.stringify({
            browserScriptedBallMotion: false,
            serverScriptedBallMotion: false,
            browserNaturalInwardPhase: true,
            serverNaturalInwardEvent: true,
          }));
          NODE

      - name: Verify server natural inward descent on five seeds
        run: |
          pnpm --filter @workspace/api-server exec tsx -e \
            "(async () => {
              const { simulatePhysicsLabRound } = await import('./src/physics-lab/simulation.ts');
              const seeds = ['61001','61002','61003','61004','61005'];
              for (const seed of seeds) {
                const row = await simulatePhysicsLabRound('part7-' + seed, seed);
                const events = row.events.map((event) => event.type);
                const required = ['TRACK_ENTRY','NATURAL_INWARD_EXIT','POCKET_ENTRY','STABLE_SETTLE'];
                for (const event of required) {
                  if (!events.includes(event)) throw new Error(seed + ' missing server event ' + event);
                }
                if (row.status !== 'SETTLED') throw new Error(seed + ' server did not settle');
                console.log('PART7_SERVER_CASE ' + JSON.stringify({
                  seed,
                  status: row.status,
                  events: required,
                  finalPocketNumber: row.finalPocketNumber,
                }));
              }
              console.log('PART7_SERVER_PASS ' + JSON.stringify({ seeds, allPassed: true }));
            })().catch((error) => { console.error(error); process.exit(1); });"

  browser-20-seed:
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        start: [0, 5, 10, 15]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build TypeScript project references
        run: pnpm run typecheck:libs

      - name: Typecheck roulette physics lab
        run: pnpm --filter @workspace/roulette-physics-lab run typecheck

      - name: Start roulette physics lab
        run: |
          PORT=4173 BASE_PATH=/ pnpm --filter @workspace/roulette-physics-lab run dev > /tmp/roulette-part7-${{ matrix.start }}.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/roulette-part7-${{ matrix.start }}.log
          exit 1

      - name: Verify five-seed natural inward batch
        env:
          START_INDEX: ${{ matrix.start }}
        run: |
          set -euo pipefail
          ROULETTE_LAB_URL="http://127.0.0.1:4173/?part6Headless=1&part6SeedStartIndex=$START_INDEX&part6SeedCount=5&part6MaxDurationSeconds=30" \
          ROULETTE_PART6_OUTPUT="artifacts/roulette-physics-lab/part7-natural-$START_INDEX.json" \
          ROULETTE_PART6_TIMEOUT_MS='240000' \
          ROULETTE_PART6_EXPECTED_SEEDS='5' \
          node scripts/roulette-part6-runtime.mjs > "part7-natural-$START_INDEX.log" 2>&1

          node - "$START_INDEX" <<'NODE'
          const fs = require('fs');
          const start = process.argv[2];
          const data = JSON.parse(
            fs.readFileSync(
              'artifacts/roulette-physics-lab/part7-natural-' + start + '.json',
              'utf8',
            ),
          );
          const rows = data.telemetry?.results ?? data.seedTelemetry ?? [];
          if (rows.length !== 5) throw new Error('Expected five Part 7 rows');

          const requiredPhases = [
            'OUTER_RACE',
            'INWARD_DESCENT',
            'DEFLECTOR_ZONE',
            'ROTOR_ENTRY',
            'POCKET',
            'SETTLED',
          ];

          for (const row of rows) {
            if (!row.settled || row.timedOut || !row.safetyPassed) {
              throw new Error(row.seed + ' did not remain settled/safe');
            }
            if (row.inwardTransitionTime == null || row.inwardTransitionRadius == null) {
              throw new Error(row.seed + ' missing natural inward transition');
            }
            if (!(row.trackEndSpeed < row.trackStartSpeed)) {
              throw new Error(row.seed + ' did not lose speed before inward descent');
            }
            if (!row.phaseSequenceValid) {
              throw new Error(row.seed + ' phase sequence invalid');
            }

            const phases = row.phases.map((event) => event.phase);
            let cursor = -1;
            for (const phase of requiredPhases) {
              const index = phases.indexOf(phase);
              if (index < 0 || index <= cursor) {
                throw new Error(
                  row.seed + ' missing/out-of-order phase ' + phase +
                  ' phases=' + phases.join(','),
                );
              }
              cursor = index;
            }

            const legacyTransitionRoles = (row.transitionContactRoles ?? [])
              .filter((role) => !String(role).startsWith('exact-glb-'));
            if (legacyTransitionRoles.length > 0) {
              throw new Error(
                row.seed + ' used legacy transition collider roles: ' +
                legacyTransitionRoles.join(','),
              );
            }

            if (
              row.escaped ||
              row.clipping ||
              row.tunneling ||
              row.velocitySpike ||
              row.artificialAcceleration
            ) {
              throw new Error(row.seed + ' failed Part 7 safety');
            }

            console.log('PART7_BROWSER_CASE ' + JSON.stringify({
              seed: row.seed,
              inwardTransitionTime: row.inwardTransitionTime,
              inwardTransitionRadius: row.inwardTransitionRadius,
              trackStartSpeed: row.trackStartSpeed,
              trackEndSpeed: row.trackEndSpeed,
              phases: requiredPhases,
              transitionContactRoles: row.transitionContactRoles,
              finalPocketNumber: row.finalPocketNumber,
            }));
          }

          console.log('PART7_BROWSER_BATCH_PASS ' + JSON.stringify({
            startIndex: Number(start),
            seeds: rows.map((row) => row.seed),
            allPassed: true,
          }));
          NODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roulette-part7-natural-${{ matrix.start }}
          path: |
            artifacts/roulette-physics-lab/part7-natural-${{ matrix.start }}.json
            part7-natural-${{ matrix.start }}.log
            /tmp/roulette-part7-${{ matrix.start }}.log
          if-no-files-found: warn
