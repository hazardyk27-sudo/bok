name: Roulette PART 6B.1 Smoke

concurrency:
  group: roulette-part6-runtime-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - feature/roulette
    paths:
      - '.github/workflows/roulette-part6-runtime.yml'
      - 'artifacts/roulette-physics-lab/**'
      - 'artifacts/api-server/src/physics-lab/**'
      - 'artifacts/cascade-8/src/roulette*.ts'
      - 'lib/roulette-physics-config.ts'
      - 'scripts/roulette-part6-*.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/roulette-part6-runtime.yml'
      - 'artifacts/roulette-physics-lab/**'
      - 'artifacts/api-server/src/physics-lab/**'
      - 'artifacts/cascade-8/src/roulette*.ts'
      - 'lib/roulette-physics-config.ts'
      - 'scripts/roulette-part6-*.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build TypeScript project references
        run: pnpm run typecheck:libs

      - name: Typecheck roulette physics lab
        run: pnpm --filter @workspace/roulette-physics-lab run typecheck

      - name: Run roulette physics contract tests
        env:
          PORT: '4173'
          BASE_PATH: /
        run: pnpm --filter @workspace/cascade-8 exec vitest run src/roulettePhysicsConfig.test.ts

      - name: Run server twenty-seed full-spin reliability (4x5)
        continue-on-error: true
        run: >
          pnpm exec tsx -e "(async()=>{const {simulatePhysicsLabRound}=await import('./artifacts/api-server/src/physics-lab/simulation.ts');const batches=[['61001','61002','61003','61004','61005'],['61006','61007','61008','61009','61010'],['61011','61012','61013','61014','61015'],['61016','61017','61018','61019','61020']];const all=[];for(let batchIndex=0;batchIndex<batches.length;batchIndex+=1){const results=[];for(const seed of batches[batchIndex]){const r=await simulatePhysicsLabRound('server-twenty-seed-'+seed,seed);const summary={seed,status:r.status,errorCode:r.errorCode,finalPocketIndex:r.finalPocketIndex,finalPocketNumber:r.finalPocketNumber,stableSettleStep:r.stableSettleStep,simulationDurationMs:r.simulationDurationMs,eventTypes:r.events.map(e=>e.type),lastEvent:r.events.at(-1)??null};results.push(summary);all.push(summary);console.log('SERVER_TWENTY_SEED_CASE',JSON.stringify({batch:batchIndex+1,...summary}));}const passed=results.filter(r=>r.status==='SETTLED'&&r.finalPocketNumber!==null).length;console.log('SERVER_FIVE_SEED_BATCH_SUMMARY',JSON.stringify({batch:batchIndex+1,passed,total:results.length,failed:results.filter(r=>r.status!=='SETTLED'||r.finalPocketNumber===null).map(r=>({seed:r.seed,errorCode:r.errorCode,lastEvent:r.lastEvent}))}));}const passed=all.filter(r=>r.status==='SETTLED'&&r.finalPocketNumber!==null).length;console.log('SERVER_TWENTY_SEED_SUMMARY',JSON.stringify({passed,total:all.length,failed:all.filter(r=>r.status!=='SETTLED'||r.finalPocketNumber===null).map(r=>({seed:r.seed,errorCode:r.errorCode,lastEvent:r.lastEvent}))}));if(passed!==all.length)process.exit(1)})().catch(error=>{console.error(error);process.exit(1)})"

      - name: Start roulette physics lab
        shell: bash
        run: |
          PORT=4173 BASE_PATH=/ pnpm --filter @workspace/roulette-physics-lab run dev > /tmp/roulette-part6-vite.log 2>&1 &
          echo $! > /tmp/roulette-part6-vite.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/roulette-part6-vite.log
          exit 1

      - name: Verify roulette GLB route
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            http://127.0.0.1:4173/rou-lp-test-04.glb \
            --output /tmp/rou-lp-test-04.glb
          bytes="$(wc -c < /tmp/rou-lp-test-04.glb | tr -d ' ')"
          echo "ROULETTE_GLB_BYTES=$bytes"
          test "$bytes" = "4663292"

      - name: Run PART 6B.1A startup-gate probe
        env:
          ROULETTE_LAB_URL: http://127.0.0.1:4173/?part6Headless=1&part6SeedCount=5&part6MaxDurationSeconds=30
          ROULETTE_PART6_OUTPUT: artifacts/roulette-physics-lab/part6-runtime-result.json
          ROULETTE_PART6_TIMEOUT_MS: '120000'
          ROULETTE_PART6_EXPECTED_SEEDS: '5'
        shell: bash
        run: |
          set -o pipefail
          node scripts/roulette-part6-runtime.mjs | tee part6-runtime.log

      - name: Run six-seed post-fret diagnostic probe
        continue-on-error: true
        env:
          ROULETTE_LAB_URL: http://127.0.0.1:4173/?part6Headless=1&part6SeedCount=6&part6MaxDurationSeconds=30
          ROULETTE_PART6_OUTPUT: artifacts/roulette-physics-lab/part6-runtime-six-seed-result.json
          ROULETTE_PART6_TIMEOUT_MS: '120000'
          ROULETTE_PART6_EXPECTED_SEEDS: '6'
        shell: bash
        run: |
          set -o pipefail
          node scripts/roulette-part6-runtime.mjs | tee part6-six-seed-trace.log

      - name: Summarize PART 6B.1 diagnostic evidence
        if: always()
        env:
          ROULETTE_PART6_OUTPUT: artifacts/roulette-physics-lab/part6-runtime-result.json
          ROULETTE_PART6_EVIDENCE: artifacts/roulette-physics-lab/part6-calibration-evidence.json
          ROULETTE_PART6_EXPECTED_SEEDS: '5'
        run: |
          if [ -f "$ROULETTE_PART6_OUTPUT" ]; then
            node scripts/roulette-part6-report.mjs | tee part6-calibration-evidence.log
          else
            echo "PART 6 runtime result was not produced."
          fi

      - name: Show Vite log on failure
        if: failure()
        run: cat /tmp/roulette-part6-vite.log || true

      - name: Upload PART 6 runtime result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roulette-part6b1-smoke
          path: |
            artifacts/roulette-physics-lab/part6-runtime-result.json
            artifacts/roulette-physics-lab/part6-calibration-evidence.json
            part6-runtime.log
            part6-calibration-evidence.log
            /tmp/roulette-part6-vite.log
          if-no-files-found: warn
