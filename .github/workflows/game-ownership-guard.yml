name: Game Ownership Guard

on:
  push:
    branches:
      - feature/slot
      - feature/roulette
      - feature/cadi-kazan
      - feature/idle
      - feature/hub
  pull_request:

jobs:
  ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve ownership scope
        id: scope
        shell: bash
        run: |
          ref="${{ github.head_ref || github.ref_name }}"
          case "$ref" in
            feature/slot) game=slot ;;
            feature/roulette) game=roulette ;;
            feature/cadi-kazan) game=cadi-kazan ;;
            feature/idle) game=idle ;;
            feature/hub) game=hub ;;
            *) echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          echo "game=$game" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Check ownership on push
        if: steps.scope.outputs.skip == 'false' && github.event_name == 'push'
        env:
          GAME_SCOPE: ${{ steps.scope.outputs.game }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/check-game-ownership.mjs
      - name: Check ownership on pull request
        if: steps.scope.outputs.skip == 'false' && github.event_name == 'pull_request'
        env:
          GAME_SCOPE: ${{ steps.scope.outputs.game }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-game-ownership.mjs
