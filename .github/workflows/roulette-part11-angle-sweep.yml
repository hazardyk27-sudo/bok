name: Roulette Part 11 Release Angle Sweep

on:
  push:
    branches:
      - feature/roulette
    paths:
      - '.github/workflows/roulette-part11-angle-sweep.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  angle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        angle: ['0','30','60','90','120','150','180','210','240','270','300','330']

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run typecheck:libs
      - run: pnpm --filter @workspace/roulette-physics-lab run typecheck

      - name: Start physics lab
        run: |
          PORT=4173 BASE_PATH=/ pnpm --filter @workspace/roulette-physics-lab run dev > /tmp/roulette-angle-${{ matrix.angle }}.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/roulette-angle-${{ matrix.angle }}.log
          exit 1

      - name: Run release angle
        env:
          ANGLE: ${{ matrix.angle }}
        run: |
          OUT="artifacts/roulette-physics-lab/part11-angle-$ANGLE.json"
          ROULETTE_LAB_URL="http://127.0.0.1:4173/?part6Headless=1&part6SeedStartIndex=6&part6SeedCount=1&part6MaxDurationSeconds=20&part11Calibration=1&part11LaunchRadius=2.39&part11LaunchSpeedMps=5.0&part11LaunchAzimuthDeg=$ANGLE" \
          ROULETTE_PART6_OUTPUT="$OUT" \
          ROULETTE_PART6_TIMEOUT_MS='120000' \
          ROULETTE_PART6_EXPECTED_SEEDS='1' \
          node scripts/roulette-part6-runtime.mjs > "part11-angle-$ANGLE.log" 2>&1 || true

          node - "$ANGLE" "$OUT" <<'NODE'
          const fs=require('fs');
          const [angle,path]=process.argv.slice(2);
          const data=fs.existsSync(path)?JSON.parse(fs.readFileSync(path,'utf8')):{};
          const row=(data.telemetry?.results ?? data.seedTelemetry ?? [])[0];
          if(!row) throw new Error('missing telemetry for angle '+angle);
          const out={
            angle:Number(angle),
            seed:row.seed,
            launchSpeedMetersPerSecond:row.launchSpeedMetersPerSecond,
            lapCount:row.lapCount,
            pocketEntryTime:row.pocketEntryTime,
            inwardTransitionTime:row.inwardTransitionTime,
            settled:row.settled,
            safetyPassed:row.safetyPassed,
            escaped:row.escaped,
            clipping:row.clipping,
            tunneling:row.tunneling,
            velocitySpike:row.velocitySpike,
            artificialAcceleration:row.artificialAcceleration,
            settleTime:row.settleTime,
            finalPocketNumber:row.finalPocketNumber
          };
          console.log('PART11_ANGLE_CASE '+JSON.stringify(out));
          fs.writeFileSync('part11-angle-'+angle+'-summary.json',JSON.stringify(out,null,2));
          NODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roulette-part11-angle-${{ matrix.angle }}
          path: |
            artifacts/roulette-physics-lab/part11-angle-${{ matrix.angle }}.json
            part11-angle-${{ matrix.angle }}*.json
            part11-angle-${{ matrix.angle }}.log
            /tmp/roulette-angle-${{ matrix.angle }}.log
          if-no-files-found: warn
