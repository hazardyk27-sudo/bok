name: Temporary 5M Free Spin Deep Simulation

on:
  push:
    branches:
      - feature/slot
    paths:
      - .github/workflows/temp-slot-fs-5m-deep.yml

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Run 5,000,000 paid-spin Free Spin deep simulation
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          cat > artifacts/cascade-8/src/simulation/tempFreeSpinDeep5m.ts <<'TS'
          import { playSpin } from "../engine/SlotEngine";
          import { SeededRNG } from "../engine/RNG";
          import { isMultiplierCore, type BoardCell } from "../engine/types";
          import {
            BONUS_INITIAL_SCATTER_CHANCE,
            BONUS_REFILL_SCATTER_CHANCE,
            BONUS_INITIAL_CORE_CHANCE,
            BONUS_REFILL_CORE_CHANCE,
            BOARD_COLUMNS,
            BOARD_ROWS,
          } from "../config/GameConfig";

          const SPINS = 5_000_000;
          const BET = 100;
          const SEED = "fs-deep-5m-20260926-v1";
          const rng = new SeededRNG(SEED);

          const pct = (n:number,d:number) => d ? n / d * 100 : 0;
          const avg = (n:number,d:number) => d ? n / d : 0;
          const r4 = (n:number) => Number(n.toFixed(4));
          const r6 = (n:number) => Number(n.toFixed(6));
          const quantile = (arr:number[], q:number) => {
            if (!arr.length) return 0;
            const s=[...arr].sort((a,b)=>a-b);
            const pos=(s.length-1)*q;
            const lo=Math.floor(pos), hi=Math.ceil(pos);
            return lo===hi ? s[lo] : s[lo] + (s[hi]-s[lo])*(pos-lo);
          };
          const countScatter = (cells:BoardCell[]) => cells.reduce((n,c)=>n+(c==="SCATTER"?1:0),0);
          const coresFrom = (cells:BoardCell[]) => cells.filter(isMultiplierCore);
          const addDist = (m:Record<string,number>, key:number|string) => {
            const k=String(key); m[k]=(m[k]??0)+1;
          };
          const bucket10 = (v:number) => v>=10 ? "10+" : String(v);
          const winBucket = (x:number) => {
            if (x===0) return "0x";
            if (x<1) return "0-1x";
            if (x<2) return "1-2x";
            if (x<5) return "2-5x";
            if (x<10) return "5-10x";
            if (x<25) return "10-25x";
            if (x<50) return "25-50x";
            if (x<100) return "50-100x";
            if (x<250) return "100-250x";
            if (x<500) return "250-500x";
            if (x<1000) return "500-1000x";
            return "1000x+";
          };

          let paidHit=0, baseHit=0;
          let totalReturnX=0, totalBaseX=0, totalBonusX=0;
          let bonusCount=0, bonusSessionsWithRetrigger=0, bonusSessionsCappedBeforeFs=0;
          let freeSpinCount=0, freeSpinHit=0, zeroFreeSpin=0;
          let totalFsWinX=0, totalFsRawX=0, totalFsTumbles=0;
          let totalRetriggerExtraSpins=0, retriggeringFs=0;
          let fsInitialCells=0, fsRefillCells=0;
          let fsInitialScatter=0, fsRefillScatter=0;
          let fsInitialCore=0, fsRefillCore=0;
          let fsWithCore=0, fsWith2PlusCore=0, fsWithInitialCore=0, fsWith2PlusInitialCore=0;
          let fsWinWithCoreX=0, fsWinWithoutCoreX=0, fsCountWithCore=0, fsCountWithoutCore=0;
          let coreValueSum=0, coreValueCount=0, combinedCoreSumActive=0, activeCoreFs=0;
          let maxFsWinX=0, maxBonusWinX=0, maxCoresInFs=0, maxScatterSpawnInFs=0, maxTumblesFs=0;
          let paid100=0, paid250=0, paid500=0, paid1000=0, paid2500=0, paid5000=0;
          let fs10=0, fs25=0, fs50=0, fs100=0, fs250=0, fs500=0, fs1000=0;
          let bonus50=0, bonus100=0, bonus250=0, bonus500=0, bonus1000=0, bonus2500=0, bonus5000=0;

          const fsWins:number[]=[];
          const bonusWins:number[]=[];
          const fsCoreCountDist:Record<string,number>={};
          const fsScatterSpawnDist:Record<string,number>={};
          const fsInitialScatterDist:Record<string,number>={};
          const fsRetriggerScatterDist:Record<string,number>={};
          const fsTumbleDist:Record<string,number>={};
          const coreValueDist:Record<string,number>={};
          const triggerScatterDist:Record<string,number>={};
          const actualFsCountPerBonusDist:Record<string,number>={};
          const fsWinHistogram:Record<string,number>={};
          const bonusWinHistogram:Record<string,number>={};
          const coreCountStats:Record<string,{count:number;winX:number;rawX:number}>={};

          for (let i=0;i<SPINS;i++) {
            const result=playSpin(BET,rng);
            const totalX=result.totalWinCents/BET;
            const baseX=result.baseWinCents/BET;
            const bonusX=result.bonusWinCents/BET;
            totalReturnX+=totalX; totalBaseX+=baseX; totalBonusX+=bonusX;
            if(result.totalWinCents>0) paidHit++;
            if(result.baseWinCents>0) baseHit++;
            if(totalX>=100) paid100++;
            if(totalX>=250) paid250++;
            if(totalX>=500) paid500++;
            if(totalX>=1000) paid1000++;
            if(totalX>=2500) paid2500++;
            if(totalX>=5000) paid5000++;

            let sessionRetrigger=false;
            if(result.bonusTriggered) {
              bonusCount++;
              addDist(triggerScatterDist,result.bonusTriggerScatterCount);
              bonusWins.push(bonusX);
              addDist(bonusWinHistogram,winBucket(bonusX));
              addDist(actualFsCountPerBonusDist,result.freeSpins.length>=40?"40+":result.freeSpins.length);
              maxBonusWinX=Math.max(maxBonusWinX,bonusX);
              if(result.freeSpins.length===0) bonusSessionsCappedBeforeFs++;
              if(bonusX>=50) bonus50++;
              if(bonusX>=100) bonus100++;
              if(bonusX>=250) bonus250++;
              if(bonusX>=500) bonus500++;
              if(bonusX>=1000) bonus1000++;
              if(bonusX>=2500) bonus2500++;
              if(bonusX>=5000) bonus5000++;
            }

            for(const fs of result.freeSpins) {
              freeSpinCount++;
              const winX=fs.win/BET;
              const rawX=fs.rawWinMultiplier;
              fsWins.push(winX);
              totalFsWinX+=winX;
              totalFsRawX+=rawX;
              if(fs.win>0) freeSpinHit++; else zeroFreeSpin++;
              maxFsWinX=Math.max(maxFsWinX,winX);
              if(winX>=10) fs10++;
              if(winX>=25) fs25++;
              if(winX>=50) fs50++;
              if(winX>=100) fs100++;
              if(winX>=250) fs250++;
              if(winX>=500) fs500++;
              if(winX>=1000) fs1000++;
              addDist(fsWinHistogram,winBucket(winX));

              const initialCells=fs.initialBoard.flat();
              const initialSc=countScatter(initialCells);
              const initialCores=coresFrom(initialCells);
              let refillCellCount=0, refillSc=0;
              const refillCores:{value:number}[]=[];
              for(const t of fs.tumbles) {
                refillCellCount+=t.newSymbols.length;
                refillSc+=countScatter(t.newSymbols);
                refillCores.push(...coresFrom(t.newSymbols));
              }
              const totalCore=initialCores.length+refillCores.length;
              const totalSc=initialSc+refillSc;
              fsInitialCells+=initialCells.length;
              fsRefillCells+=refillCellCount;
              fsInitialScatter+=initialSc;
              fsRefillScatter+=refillSc;
              fsInitialCore+=initialCores.length;
              fsRefillCore+=refillCores.length;
              maxCoresInFs=Math.max(maxCoresInFs,totalCore);
              maxScatterSpawnInFs=Math.max(maxScatterSpawnInFs,totalSc);
              addDist(fsCoreCountDist,totalCore);
              addDist(fsScatterSpawnDist,bucket10(totalSc));
              addDist(fsInitialScatterDist,initialSc);
              addDist(fsRetriggerScatterDist,fs.retriggerScatterCount);
              addDist(fsTumbleDist,fs.tumbles.length>=10?"10+":fs.tumbles.length);
              totalFsTumbles+=fs.tumbles.length;
              maxTumblesFs=Math.max(maxTumblesFs,fs.tumbles.length);

              if(totalCore>0) {
                fsWithCore++; fsCountWithCore++; fsWinWithCoreX+=winX;
                activeCoreFs++;
                const vals=[...initialCores,...refillCores].map(c=>c.value);
                const combined=vals.reduce((a,b)=>a+b,0);
                combinedCoreSumActive+=combined;
                for(const v of vals) {
                  coreValueSum+=v; coreValueCount++; addDist(coreValueDist,v);
                }
              } else {
                fsCountWithoutCore++; fsWinWithoutCoreX+=winX;
              }
              if(totalCore>=2) fsWith2PlusCore++;
              if(initialCores.length>=1) fsWithInitialCore++;
              if(initialCores.length>=2) fsWith2PlusInitialCore++;
              const ck=String(totalCore);
              coreCountStats[ck]??={count:0,winX:0,rawX:0};
              coreCountStats[ck].count++;
              coreCountStats[ck].winX+=winX;
              coreCountStats[ck].rawX+=rawX;

              if(fs.retriggered>0) {
                retriggeringFs++;
                totalRetriggerExtraSpins+=fs.retriggered;
                sessionRetrigger=true;
              }
            }
            if(result.bonusTriggered && sessionRetrigger) bonusSessionsWithRetrigger++;

            if((i+1)%500_000===0) {
              console.log("PROGRESS",i+1,"/",SPINS,"freeSpins",freeSpinCount,"bonuses",bonusCount);
            }
          }

          const generatedFsCells=fsInitialCells+fsRefillCells;
          const totalScatter=fsInitialScatter+fsRefillScatter;
          const totalCore=fsInitialCore+fsRefillCore;

          const distPct=(dist:Record<string,number>,den:number)=>Object.fromEntries(
            Object.entries(dist)
              .sort((a,b)=>Number.parseFloat(a[0])-Number.parseFloat(b[0]))
              .map(([k,v])=>[k,{count:v,pct:r4(pct(v,den))}])
          );
          const coreCountTable=Object.fromEntries(
            Object.entries(coreCountStats)
              .sort((a,b)=>Number(a[0])-Number(b[0]))
              .map(([k,v])=>[k,{
                count:v.count,
                sharePct:r4(pct(v.count,freeSpinCount)),
                avgWinX:r4(avg(v.winX,v.count)),
                avgRawWinX:r4(avg(v.rawX,v.count)),
              }])
          );
          const coreValuePct=Object.fromEntries(
            Object.entries(coreValueDist)
              .sort((a,b)=>Number(a[0])-Number(b[0]))
              .map(([k,v])=>[k,{count:v,pct:r4(pct(v,coreValueCount))}])
          );

          const report={
            run:{
              paidSpins:SPINS,betCents:BET,seed:SEED,
              boardCells:BOARD_COLUMNS*BOARD_ROWS,
              configuredBonusInitialScatterPct:r4(BONUS_INITIAL_SCATTER_CHANCE*100),
              configuredBonusRefillScatterPct:r4(BONUS_REFILL_SCATTER_CHANCE*100),
              configuredBonusInitialCorePct:r4(BONUS_INITIAL_CORE_CHANCE*100),
              configuredBonusRefillCorePct:r4(BONUS_REFILL_CORE_CHANCE*100),
            },
            overall:{
              rtpPct:r4(totalReturnX/SPINS*100),
              baseRtpPct:r4(totalBaseX/SPINS*100),
              bonusRtpPct:r4(totalBonusX/SPINS*100),
              hitRatePct:r4(pct(paidHit,SPINS)),
              baseHitRatePct:r4(pct(baseHit,SPINS)),
              averagePaidSpinWinX:r4(avg(totalReturnX,SPINS)),
              frequenciesPct:{
                "100x+":r6(pct(paid100,SPINS)),"250x+":r6(pct(paid250,SPINS)),
                "500x+":r6(pct(paid500,SPINS)),"1000x+":r6(pct(paid1000,SPINS)),
                "2500x+":r6(pct(paid2500,SPINS)),"5000x+":r6(pct(paid5000,SPINS)),
              }
            },
            bonus:{
              triggerCount:bonusCount,
              frequencyOneIn:bonusCount?r4(SPINS/bonusCount):0,
              triggerRatePct:r6(pct(bonusCount,SPINS)),
              triggerScatterDistribution:distPct(triggerScatterDist,bonusCount),
              actualFreeSpinsPlayed:freeSpinCount,
              averageActualFreeSpinsPerBonus:r4(avg(freeSpinCount,bonusCount)),
              actualFreeSpinCountDistribution:distPct(actualFsCountPerBonusDist,bonusCount),
              sessionsWithRetrigger:bonusSessionsWithRetrigger,
              sessionRetriggerRatePct:r4(pct(bonusSessionsWithRetrigger,bonusCount)),
              sessionsCappedBeforeAnyFs:bonusSessionsCappedBeforeFs,
              averageBonusWinX:r4(avg(totalBonusX,bonusCount)),
              medianBonusWinX:r4(quantile(bonusWins,.5)),
              p75BonusWinX:r4(quantile(bonusWins,.75)),
              p90BonusWinX:r4(quantile(bonusWins,.9)),
              p95BonusWinX:r4(quantile(bonusWins,.95)),
              p99BonusWinX:r4(quantile(bonusWins,.99)),
              maxBonusWinX:r4(maxBonusWinX),
              winHistogram:bonusWinHistogram,
              frequenciesPct:{
                "50x+":r4(pct(bonus50,bonusCount)),"100x+":r4(pct(bonus100,bonusCount)),
                "250x+":r4(pct(bonus250,bonusCount)),"500x+":r4(pct(bonus500,bonusCount)),
                "1000x+":r4(pct(bonus1000,bonusCount)),"2500x+":r4(pct(bonus2500,bonusCount)),
                "5000x+":r4(pct(bonus5000,bonusCount)),
              }
            },
            freeSpin:{
              count:freeSpinCount,
              hitCount:freeSpinHit,
              hitRatePct:r4(pct(freeSpinHit,freeSpinCount)),
              zeroRatePct:r4(pct(zeroFreeSpin,freeSpinCount)),
              averageWinX:r4(avg(totalFsWinX,freeSpinCount)),
              averageRawWinX:r4(avg(totalFsRawX,freeSpinCount)),
              medianWinX:r4(quantile(fsWins,.5)),
              p75WinX:r4(quantile(fsWins,.75)),
              p90WinX:r4(quantile(fsWins,.9)),
              p95WinX:r4(quantile(fsWins,.95)),
              p99WinX:r4(quantile(fsWins,.99)),
              maxWinX:r4(maxFsWinX),
              averageTumbles:r4(avg(totalFsTumbles,freeSpinCount)),
              maxTumbles:maxTumblesFs,
              tumbleDistribution:distPct(fsTumbleDist,freeSpinCount),
              winHistogram:fsWinHistogram,
              frequenciesPct:{
                "10x+":r4(pct(fs10,freeSpinCount)),"25x+":r4(pct(fs25,freeSpinCount)),
                "50x+":r4(pct(fs50,freeSpinCount)),"100x+":r4(pct(fs100,freeSpinCount)),
                "250x+":r4(pct(fs250,freeSpinCount)),"500x+":r4(pct(fs500,freeSpinCount)),
                "1000x+":r4(pct(fs1000,freeSpinCount)),
              },
              retriggeringFreeSpins:retriggeringFs,
              retriggerEventRatePct:r4(pct(retriggeringFs,freeSpinCount)),
              extraSpinsAwarded:totalRetriggerExtraSpins,
              averageExtraSpinsPerFs:r6(avg(totalRetriggerExtraSpins,freeSpinCount)),
              retriggerScatterDistribution:distPct(fsRetriggerScatterDist,freeSpinCount),
            },
            scatter:{
              initialCells:fsInitialCells,refillCells:fsRefillCells,totalGeneratedCells:generatedFsCells,
              initialScatterCount:fsInitialScatter,refillScatterCount:fsRefillScatter,totalScatterCount:totalScatter,
              averageInitialScatterPerFs:r6(avg(fsInitialScatter,freeSpinCount)),
              averageRefillScatterPerFs:r6(avg(fsRefillScatter,freeSpinCount)),
              averageTotalScatterPerFs:r6(avg(totalScatter,freeSpinCount)),
              initialCellRatePct:r6(pct(fsInitialScatter,fsInitialCells)),
              refillCellRatePct:r6(pct(fsRefillScatter,fsRefillCells)),
              overallGeneratedCellRatePct:r6(pct(totalScatter,generatedFsCells)),
              initialScatterDistribution:distPct(fsInitialScatterDist,freeSpinCount),
              totalScatterSpawnDistribution:distPct(fsScatterSpawnDist,freeSpinCount),
              maxScatterSpawnInOneFs:maxScatterSpawnInFs,
            },
            core:{
              initialCoreCount:fsInitialCore,refillCoreCount:fsRefillCore,totalCoreCount:totalCore,
              averageInitialCorePerFs:r6(avg(fsInitialCore,freeSpinCount)),
              averageRefillCorePerFs:r6(avg(fsRefillCore,freeSpinCount)),
              averageTotalCorePerFs:r6(avg(totalCore,freeSpinCount)),
              initialCellRatePct:r6(pct(fsInitialCore,fsInitialCells)),
              refillCellRatePct:r6(pct(fsRefillCore,fsRefillCells)),
              overallGeneratedCellRatePct:r6(pct(totalCore,generatedFsCells)),
              fsWithAtLeastOneCore:fsWithCore,
              fsWithAtLeastOneCorePct:r4(pct(fsWithCore,freeSpinCount)),
              fsWithAtLeastTwoCores:fsWith2PlusCore,
              fsWithAtLeastTwoCoresPct:r4(pct(fsWith2PlusCore,freeSpinCount)),
              fsInitialWithAtLeastOneCorePct:r4(pct(fsWithInitialCore,freeSpinCount)),
              fsInitialWithAtLeastTwoCoresPct:r4(pct(fsWith2PlusInitialCore,freeSpinCount)),
              maxCoresInOneFs:maxCoresInFs,
              coreCountDistribution:distPct(fsCoreCountDist,freeSpinCount),
              averageCoreValueX:r4(avg(coreValueSum,coreValueCount)),
              coreValueDistribution:coreValuePct,
              averageCombinedCoreWhenActiveX:r4(avg(combinedCoreSumActive,activeCoreFs)),
              averageFsWinWithCoreX:r4(avg(fsWinWithCoreX,fsCountWithCore)),
              averageFsWinWithoutCoreX:r4(avg(fsWinWithoutCoreX,fsCountWithoutCore)),
              byCoreCount:coreCountTable,
            }
          };
          console.log("RESULT_JSON="+JSON.stringify(report));
          TS

          time pnpm --filter @workspace/cascade-8 exec tsx src/simulation/tempFreeSpinDeep5m.ts
