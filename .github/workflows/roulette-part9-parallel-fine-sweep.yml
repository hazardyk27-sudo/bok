name: Roulette Part 9 Parallel Fine Sweep

on:
  push:
    branches:
      - feature/roulette
    paths:
      - '.github/workflows/roulette-part9-parallel-fine-sweep.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - radius: 2.44
            speed: 5.5
          - radius: 2.44
            speed: 5.8
          - radius: 2.44
            speed: 6.0
          - radius: 2.44
            speed: 6.2
          - radius: 2.45
            speed: 5.5
          - radius: 2.45
            speed: 5.8
          - radius: 2.45
            speed: 6.0
          - radius: 2.45
            speed: 6.2
          - radius: 2.46
            speed: 5.5
          - radius: 2.46
            speed: 5.8
          - radius: 2.46
            speed: 6.0
          - radius: 2.46
            speed: 6.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build TypeScript project references
        run: pnpm run typecheck:libs
      - name: Typecheck roulette physics lab
        run: pnpm --filter @workspace/roulette-physics-lab run typecheck
      - name: Start roulette physics lab
        run: |
          PORT=4173 BASE_PATH=/ pnpm --filter @workspace/roulette-physics-lab run dev > /tmp/roulette-part9-parallel.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/roulette-part9-parallel.log
          exit 1
      - name: Run calibration candidate
        env:
          RADIUS: ${{ matrix.radius }}
          SPEED: ${{ matrix.speed }}
        run: |
          tag="r$RADIUS-s$SPEED"
          ROULETTE_LAB_URL="http://127.0.0.1:4173/?part6Headless=1&part6SeedStartIndex=6&part6SeedCount=1&part6MaxDurationSeconds=20&part9Calibration=1&part9LaunchRadius=$RADIUS&part9LaunchSpeedMps=$SPEED&part9TrackFriction=0.028&part9LaunchGap=0.01" \
          ROULETTE_PART6_OUTPUT="artifacts/roulette-physics-lab/part9-parallel-$tag.json" \
          ROULETTE_PART6_TIMEOUT_MS='120000' \
          ROULETTE_PART6_EXPECTED_SEEDS='1' \
          node scripts/roulette-part6-runtime.mjs > "part9-parallel-$tag.log" 2>&1

          node -e '
            const fs=require("fs");
            const radius=Number(process.env.RADIUS);
            const speed=Number(process.env.SPEED);
            const tag="r"+process.env.RADIUS+"-s"+process.env.SPEED;
            const data=JSON.parse(fs.readFileSync("artifacts/roulette-physics-lab/part9-parallel-"+tag+".json","utf8"));
            const row=(data.telemetry?.results ?? data.seedTelemetry ?? [])[0];
            if(!row) throw new Error("missing telemetry");
            const out={
              radius,speed,friction:0.028,seed:row.seed,lapCount:row.lapCount,
              trackDuration:row.trackDuration,trackStartSpeed:row.trackStartSpeed,
              trackEndSpeed:row.trackEndSpeed,settled:row.settled,timedOut:row.timedOut,
              safetyPassed:row.safetyPassed,escaped:row.escaped,clipping:row.clipping,
              tunneling:row.tunneling,velocitySpike:row.velocitySpike,
              artificialAcceleration:row.artificialAcceleration,settleTime:row.settleTime,
              finalPocketNumber:row.finalPocketNumber,
              inTargetBand:row.lapCount>=4&&row.lapCount<=5
            };
            console.log("PART9_PARALLEL_CASE "+JSON.stringify(out));
          '

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roulette-part9-parallel-${{ matrix.radius }}-${{ matrix.speed }}
          path: |
            artifacts/roulette-physics-lab/part9-parallel-*.json
            part9-parallel-*.log
            /tmp/roulette-part9-parallel.log
          if-no-files-found: warn
