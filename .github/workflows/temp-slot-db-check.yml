name: Temporary Slot DB Integration Check

on:
  push:
    branches:
      - feature/slot
    paths:
      - .github/workflows/temp-slot-db-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: slot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d slot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/slot_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create minimal Slot tables
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d slot_test <<'SQL'
          CREATE TABLE roulette_wallets (
            session_id text PRIMARY KEY,
            balance_cents integer NOT NULL,
            updated_at timestamptz NOT NULL DEFAULT now()
          );
          CREATE TABLE slot_rounds (
            id text PRIMARY KEY,
            session_id text NOT NULL,
            stake_cents integer NOT NULL,
            payout_cents integer NOT NULL,
            result jsonb NOT NULL,
            idempotency_key text NOT NULL UNIQUE,
            created_at timestamptz NOT NULL DEFAULT now()
          );
          CREATE TABLE slot_ledger (
            id text PRIMARY KEY,
            session_id text NOT NULL,
            round_id text NOT NULL,
            kind text NOT NULL,
            amount_cents integer NOT NULL,
            idempotency_key text NOT NULL UNIQUE,
            created_at timestamptz NOT NULL DEFAULT now()
          );
          CREATE TABLE slot_wallet_migrations (
            id text PRIMARY KEY,
            session_id text NOT NULL UNIQUE,
            legacy_balance_cents integer NOT NULL,
            disposition text NOT NULL,
            created_at timestamptz NOT NULL DEFAULT now()
          );
          SQL
      - name: Exercise paid free and duplicate spins
        run: |
          cat > artifacts/api-server/src/slot/tempDbIntegration.ts <<'TS'
          import { pool } from "@workspace/db";
          import { slotRepository } from "./repository";
          import { FREE_BET_CENTS } from "../../../cascade-8/src/config/GameConfig";

          const sessionId = "integration-session-123456";
          const initial = await slotRepository.getState(sessionId);
          const paid = await slotRepository.spin(sessionId, {
            stakeCents: 20,
            idempotencyKey: "integration-paid-000001",
          });
          const duplicate = await slotRepository.spin(sessionId, {
            stakeCents: 20,
            idempotencyKey: "integration-paid-000001",
          });
          if (duplicate.roundId !== paid.roundId) throw new Error("duplicate round mismatch");
          if (duplicate.wallet.balanceCents !== paid.wallet.balanceCents) throw new Error("duplicate changed wallet");

          const free = await slotRepository.spin(sessionId, {
            stakeCents: FREE_BET_CENTS,
            idempotencyKey: "integration-free-000001",
          });

          const ledger = await pool.query(
            "SELECT kind, count(*)::int AS count FROM slot_ledger WHERE session_id=$1 GROUP BY kind ORDER BY kind",
            [sessionId],
          );
          const rounds = await pool.query(
            "SELECT count(*)::int AS count FROM slot_rounds WHERE session_id=$1",
            [sessionId],
          );
          const paidStakeEntries = Number(ledger.rows.find((r) => r.kind === "STAKE_DEBIT")?.count ?? 0);
          const payoutEntries = Number(ledger.rows.find((r) => r.kind === "PAYOUT_CREDIT")?.count ?? 0);
          if (Number(rounds.rows[0]?.count) !== 2) throw new Error("expected exactly two unique rounds");
          if (paidStakeEntries !== 1) throw new Error("expected one paid stake ledger row");
          if (payoutEntries !== 2) throw new Error("expected two payout ledger rows");
          if (!Number.isInteger(free.wallet.balanceCents)) throw new Error("invalid free spin wallet");
          if (!Number.isInteger(initial.wallet.balanceCents)) throw new Error("invalid initial wallet");
          console.log("SLOT_DB_INTEGRATION_OK", {
            initialBalance: initial.wallet.balanceCents,
            paidBalance: paid.wallet.balanceCents,
            freeBalance: free.wallet.balanceCents,
            paidStakeEntries,
            payoutEntries,
          });
          await pool.end();
          TS
          pnpm exec tsx artifacts/api-server/src/slot/tempDbIntegration.ts
