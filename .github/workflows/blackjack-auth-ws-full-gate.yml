name: Blackjack Auth WS Full Gate

on:
  push:
    branches:
      - preflight/blackjack-auth-ws-full-gate-20261004

jobs:
  full-blackjack-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Full Blackjack regression gate
        run: bash scripts/run-game-gate.sh blackjack
