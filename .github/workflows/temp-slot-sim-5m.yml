name: Temporary Slot 5M Simulation

on:
  push:
    branches:
      - feature/slot
    paths:
      - .github/workflows/temp-slot-sim-5m.yml

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run 5M simulation
        run: |
          set -o pipefail
          pnpm --filter @workspace/cascade-8 run simulate -- --spins=5000000 --seed=pair85-5m-20260923 | tee slot-5m.log
      - name: Collect newest report
        if: always()
        run: |
          mkdir -p slot-5m-artifact
          cp slot-5m.log slot-5m-artifact/slot-5m.log || true
          latest_json="$(ls -1t artifacts/cascade-8/simulation-results/*.json 2>/dev/null | head -n 1 || true)"
          latest_md="$(ls -1t artifacts/cascade-8/simulation-results/*.md 2>/dev/null | head -n 1 || true)"
          [ -n "$latest_json" ] && cp "$latest_json" slot-5m-artifact/report.json
          [ -n "$latest_md" ] && cp "$latest_md" slot-5m-artifact/report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slot-pair85-5m
          path: slot-5m-artifact
          if-no-files-found: warn
