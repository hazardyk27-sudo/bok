name: Temp Slot 5M Eight Symbol Cap

on:
  push:
    branches:
      - tmp/slot-5m-eight-symbol-cap

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Verify slot config
        run: |
          grep -E "MAX_VISIBLE_NORMAL_SYMBOLS|BONUS_INITIAL_PAIR_COPY_CHANCE|BONUS_REFILL_PAIR_COPY_CHANCE|BONUS_THIRD_REPEAT_WEIGHT_FACTOR|BONUS_INITIAL_CORE_CHANCE|BONUS_REFILL_CORE_CHANCE" artifacts/cascade-8/src/config/GameConfig.ts
      - name: Typecheck
        run: pnpm --filter @workspace/cascade-8 run typecheck
      - name: Verify symbol-cap tests
        run: |
          PORT=4173 BASE_PATH=/ pnpm --filter @workspace/cascade-8 exec vitest run src/engine/BoardGenerator.test.ts -t "caps both Base and Free Spin initial boards at eight distinct normal symbols|blocks a pending ninth symbol"
          PORT=4173 BASE_PATH=/ pnpm --filter @workspace/cascade-8 exec vitest run src/engine/WinEvaluator.test.ts -t "does not introduce a ninth distinct normal symbol"
      - name: Run 5M simulation
        run: pnpm --filter @workspace/cascade-8 run simulate -- --spins=5000000 --seed=fs-deep-5m-20260927-v3
