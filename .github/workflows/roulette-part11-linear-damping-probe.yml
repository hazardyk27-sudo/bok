name: Roulette Part 11 Linear Damping Probe

on:
  push:
    branches:
      - feature/roulette
    paths:
      - '.github/workflows/roulette-part11-linear-damping-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        damping: ['0.010', '0.005', '0.000']

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: Apply test-only linear damping
        env:
          DAMPING: ${{ matrix.damping }}
        run: |
          python - "${DAMPING}" <<'PY'
          from pathlib import Path
          import sys
          path = Path("artifacts/roulette-physics-lab/src/Part2SceneViewport.tsx")
          text = path.read_text()
          old = "const PART3_OUTER_SPIN_LINEAR_DAMPING = 0.01;"
          if old not in text:
              raise SystemExit("expected outer-spin linear damping constant not found")
          value = float(sys.argv[1])
          text = text.replace(
              old,
              f"const PART3_OUTER_SPIN_LINEAR_DAMPING = {value:.3f};",
              1,
          )
          path.write_text(text)
          PY

      - run: pnpm run typecheck:libs
      - run: pnpm --filter @workspace/roulette-physics-lab run typecheck

      - name: Start physics lab
        run: |
          PORT=4173 BASE_PATH=/ pnpm --filter @workspace/roulette-physics-lab run dev > /tmp/roulette-part11-linear-${{ matrix.damping }}.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/roulette-part11-linear-${{ matrix.damping }}.log
          exit 1

      - name: Run two difficult seeds
        env:
          DAMPING: ${{ matrix.damping }}
        shell: bash
        run: |
          set -u
          : > "part11-linear-${DAMPING}.ndjson"
          for spec in 61007:6 61014:13; do
            SEED="${spec%%:*}"
            START="${spec##*:}"
            OUT="part11-linear-${DAMPING}-${SEED}.json"
            LOG="part11-linear-${DAMPING}-${SEED}.log"

            ROULETTE_LAB_URL="http://127.0.0.1:4173/?part6Headless=1&part6SeedStartIndex=${START}&part6SeedCount=1&part6MaxDurationSeconds=30&part11Calibration=1&part11LaunchRadius=2.39&part11LaunchSpeedMps=5.00&part11BallScale=0.70&part11SpinFactor=1.0&part11TrackFriction=0.028" \
            ROULETTE_PART6_OUTPUT="${OUT}" \
            ROULETTE_PART6_TIMEOUT_MS='150000' \
            ROULETTE_PART6_EXPECTED_SEEDS='1' \
            node scripts/roulette-part6-runtime.mjs > "${LOG}" 2>&1 || true

            node - "${SEED}" "${OUT}" "${DAMPING}" <<'NODE' | tee -a "part11-linear-${DAMPING}.ndjson"
          const fs = require('fs');
          const [seed, outPath, damping] = process.argv.slice(2);
          let row = null;
          if (fs.existsSync(outPath)) {
            const data = JSON.parse(fs.readFileSync(outPath, 'utf8'));
            row = (data.telemetry?.results ?? data.seedTelemetry ?? [])[0] ?? null;
          }
          console.log(JSON.stringify({
            linearDamping:Number(damping),
            seed:Number(seed),
            telemetry:Boolean(row),
            lapCount:row?.lapCount ?? null,
            trackDuration:row?.trackDuration ?? null,
            inwardTransitionTime:row?.inwardTransitionTime ?? null,
            maxRadius:row?.maxRadius ?? null,
            settled:row?.settled ?? null,
            timedOut:row?.timedOut ?? null,
            safetyPassed:row?.safetyPassed ?? null,
            escaped:row?.escaped ?? null,
            clipping:row?.clipping ?? null,
            tunneling:row?.tunneling ?? null,
            velocitySpike:row?.velocitySpike ?? null,
            artificialAcceleration:row?.artificialAcceleration ?? null,
            finalPocketNumber:row?.finalPocketNumber ?? null
          }));
          NODE
          done

      - name: Summarize damping
        env:
          DAMPING: ${{ matrix.damping }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const damping = process.env.DAMPING;
          const rows = fs.readFileSync('part11-linear-' + damping + '.ndjson', 'utf8')
            .trim().split(/\n+/).filter(Boolean).map(JSON.parse);
          if (rows.length !== 2 || rows.some(r => !r.telemetry)) {
            throw new Error(damping + ': expected 2 telemetry rows');
          }
          console.log('PART11_LINEAR_DAMPING_SUMMARY ' + JSON.stringify({
            linearDamping:Number(damping),
            minLap:Math.min(...rows.map(r => Number(r.lapCount))),
            maxLap:Math.max(...rows.map(r => Number(r.lapCount))),
            allSafe:rows.every(r =>
              r.settled && !r.timedOut && r.safetyPassed &&
              !r.escaped && !r.clipping && !r.tunneling &&
              !r.velocitySpike && !r.artificialAcceleration &&
              r.finalPocketNumber != null
            ),
            rows
          }));
          NODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roulette-part11-linear-${{ matrix.damping }}
          path: |
            part11-linear-${{ matrix.damping }}*
            /tmp/roulette-part11-linear-${{ matrix.damping }}.log
          if-no-files-found: warn
