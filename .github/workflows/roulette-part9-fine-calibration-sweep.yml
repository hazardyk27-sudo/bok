name: Roulette Part 9 Fine Calibration Sweep

on:
  push:
    branches:
      - feature/roulette
    paths:
      - '.github/workflows/roulette-part9-fine-calibration-sweep.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build TypeScript project references
        run: pnpm run typecheck:libs
      - name: Typecheck roulette physics lab
        run: pnpm --filter @workspace/roulette-physics-lab run typecheck
      - name: Start roulette physics lab
        run: |
          PORT=4173 BASE_PATH=/ pnpm --filter @workspace/roulette-physics-lab run dev > /tmp/roulette-part9-fine-vite.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/roulette-part9-fine-vite.log
          exit 1
      - name: Sweep local safe region
        shell: bash
        run: |
          set -euo pipefail
          : > part9-fine-results.ndjson
          mkdir -p artifacts/roulette-physics-lab/part9-fine

          for radius in 2.44 2.45 2.46; do
            for speed in 5.4 5.7 6.0 6.3; do
              for friction in 0.026 0.028; do
                tag="r${radius}-s${speed}-f${friction}"
                echo "PART9_FINE_START radius=$radius speed=$speed friction=$friction"
                ROULETTE_LAB_URL="http://127.0.0.1:4173/?part6Headless=1&part6SeedStartIndex=6&part6SeedCount=1&part6MaxDurationSeconds=20&part9Calibration=1&part9LaunchRadius=$radius&part9LaunchSpeedMps=$speed&part9TrackFriction=$friction&part9LaunchGap=0.01" \
                ROULETTE_PART6_OUTPUT="artifacts/roulette-physics-lab/part9-fine/$tag.json" \
                ROULETTE_PART6_TIMEOUT_MS='120000' \
                ROULETTE_PART6_EXPECTED_SEEDS='1' \
                node scripts/roulette-part6-runtime.mjs > "part9-fine-$tag.log" 2>&1 || true

                node -e '
                  const fs=require("fs");
                  const radius=Number(process.argv[1]);
                  const speed=Number(process.argv[2]);
                  const friction=Number(process.argv[3]);
                  const tag=process.argv[4];
                  const path="artifacts/roulette-physics-lab/part9-fine/"+tag+".json";
                  let out={radius,speed,friction,telemetry:false};
                  if(fs.existsSync(path)){
                    const data=JSON.parse(fs.readFileSync(path,"utf8"));
                    const row=(data.telemetry?.results ?? data.seedTelemetry ?? [])[0];
                    if(row) out={
                      radius,speed,friction,telemetry:true,seed:row.seed,
                      lapCount:row.lapCount,trackDuration:row.trackDuration,
                      trackStartSpeed:row.trackStartSpeed,trackEndSpeed:row.trackEndSpeed,
                      settled:row.settled,timedOut:row.timedOut,safetyPassed:row.safetyPassed,
                      escaped:row.escaped,clipping:row.clipping,tunneling:row.tunneling,
                      velocitySpike:row.velocitySpike,artificialAcceleration:row.artificialAcceleration,
                      settleTime:row.settleTime,finalPocketNumber:row.finalPocketNumber
                    };
                  }
                  fs.appendFileSync("part9-fine-results.ndjson",JSON.stringify(out)+"\n");
                  console.log("PART9_FINE_CASE "+JSON.stringify(out));
                ' "$radius" "$speed" "$friction" "$tag"
              done
            done
          done
      - name: Rank local candidates
        run: |
          node -e '
            const fs=require("fs");
            const rows=fs.readFileSync("part9-fine-results.ndjson","utf8").trim().split(/\n+/).filter(Boolean).map(JSON.parse);
            const safe=rows.filter(r=>r.telemetry&&r.settled&&!r.timedOut&&r.safetyPassed&&!r.escaped&&!r.clipping&&!r.tunneling&&!r.velocitySpike&&!r.artificialAcceleration)
              .map(r=>({...r,targetDistance:Math.abs(r.lapCount-4.5),inTargetBand:r.lapCount>=4&&r.lapCount<=5}))
              .sort((a,b)=>Number(b.inTargetBand)-Number(a.inTargetBand)||a.targetDistance-b.targetDistance);
            console.log("PART9_FINE_RANKED "+JSON.stringify(safe));
            fs.writeFileSync("part9-fine-ranked.json",JSON.stringify(safe,null,2));
            if(!safe.length) process.exit(1);
          '
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roulette-part9-fine-calibration-sweep
          path: |
            artifacts/roulette-physics-lab/part9-fine/
            part9-fine-results.ndjson
            part9-fine-ranked.json
            part9-fine-*.log
            /tmp/roulette-part9-fine-vite.log
          if-no-files-found: warn
