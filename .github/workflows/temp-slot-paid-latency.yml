name: Temporary Slot Paid Latency Diagnostic

on:
  push:
    branches:
      - feature/slot
    paths:
      - .github/workflows/temp-slot-paid-latency.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Compare free and paid spin endpoint latency
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://cascade-8-slot-game.replit.app"
          COOKIE="$(mktemp)"
          OUT="$RUNNER_TEMP/paid-latency.tsv"
          echo "kind idx code ttfb total size" > "$OUT"
          curl -sS -b "$COOKIE" -c "$COOKIE" -o /dev/null "$BASE/api/slot/state"
          for kind in free paid; do
            stake=100
            [ "$kind" = "paid" ] && stake=20
            for i in $(seq 1 30); do
              KEY="diag-${GITHUB_RUN_ID}-${kind}-${i}-$(date +%s%N)"
              curl -sS --max-time 30 -b "$COOKIE" -c "$COOKIE" -o /dev/null \
                -H "Content-Type: application/json" \
                -d "{\"stakeCents\":$stake,\"idempotencyKey\":\"$KEY\"}" \
                -w "$kind $i %{http_code} %{time_starttransfer} %{time_total} %{size_download}\\n" \
                "$BASE/api/slot/spins" >> "$OUT"
            done
          done
          cat "$OUT"
          python - "$OUT" <<'PY'
          import sys, statistics
          rows=[]
          with open(sys.argv[1]) as f:
              next(f)
              for line in f:
                  kind,idx,code,ttfb,total,size=line.split()
                  rows.append((kind,int(idx),int(code),float(ttfb)*1000,float(total)*1000,int(float(size))))
          def pct(a,p):
              s=sorted(a); return s[round((len(s)-1)*p)]
          for kind in ("free","paid"):
              rs=[r for r in rows if r[0]==kind]
              vals=[r[4] for r in rs]; t=[r[3] for r in rs]
              print(f"SUMMARY {kind}: median={statistics.median(vals):.1f}ms p95={pct(vals,.95):.1f}ms max={max(vals):.1f}ms median_ttfb={statistics.median(t):.1f}ms")
          PY
