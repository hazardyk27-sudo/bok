name: Roulette Part 11 Minimum Lap Sweep

on:
  push:
    branches:
      - feature/roulette
    paths:
      - '.github/workflows/roulette-part11-minlap-sweep.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: r242-s62
            radius: '2.42'
            speed: '6.2'
          - id: r242-s66
            radius: '2.42'
            speed: '6.6'
          - id: r242-s70
            radius: '2.42'
            speed: '7.0'
          - id: r244-s62
            radius: '2.44'
            speed: '6.2'
          - id: r244-s66
            radius: '2.44'
            speed: '6.6'
          - id: r244-s70
            radius: '2.44'
            speed: '7.0'
          - id: r246-s62
            radius: '2.46'
            speed: '6.2'
          - id: r246-s66
            radius: '2.46'
            speed: '6.6'
          - id: r246-s70
            radius: '2.46'
            speed: '7.0'
          - id: r248-s62
            radius: '2.48'
            speed: '6.2'
          - id: r248-s66
            radius: '2.48'
            speed: '6.6'
          - id: r248-s70
            radius: '2.48'
            speed: '7.0'

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run typecheck:libs
      - run: pnpm --filter @workspace/roulette-physics-lab run typecheck

      - name: Start physics lab
        run: |
          PORT=4173 BASE_PATH=/ pnpm --filter @workspace/roulette-physics-lab run dev > /tmp/roulette-part11-${{ matrix.id }}.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/roulette-part11-${{ matrix.id }}.log
          exit 1

      - name: Run five-seed candidate
        env:
          CANDIDATE_ID: ${{ matrix.id }}
          RADIUS: ${{ matrix.radius }}
          SPEED: ${{ matrix.speed }}
        shell: bash
        run: |
          set -u
          mkdir -p "artifacts/roulette-physics-lab/part11-$CANDIDATE_ID"
          : > "part11-$CANDIDATE_ID.ndjson"
          for spec in 61007:6 61014:13 61011:10 61009:8 61012:11; do
            SEED="${spec%%:*}"
            START="${spec##*:}"
            OUT="artifacts/roulette-physics-lab/part11-$CANDIDATE_ID/$SEED.json"
            LOG="part11-$CANDIDATE_ID-$SEED.log"
            ROULETTE_LAB_URL="http://127.0.0.1:4173/?part6Headless=1&part6SeedStartIndex=$START&part6SeedCount=1&part6MaxDurationSeconds=20&part11Calibration=1&part11LaunchRadius=$RADIUS&part11LaunchSpeedMps=$SPEED" \
            ROULETTE_PART6_OUTPUT="$OUT" \
            ROULETTE_PART6_TIMEOUT_MS='120000' \
            ROULETTE_PART6_EXPECTED_SEEDS='1' \
            node scripts/roulette-part6-runtime.mjs > "$LOG" 2>&1 || true

            node - "$SEED" "$OUT" "$CANDIDATE_ID" "$RADIUS" "$SPEED" <<'NODE' | tee -a "part11-$CANDIDATE_ID.ndjson"
          const fs = require('fs');
          const [seed, path, id, radius, speed] = process.argv.slice(2);
          let out = { id, radius:Number(radius), speed:Number(speed), seed:Number(seed), telemetry:false };
          if (fs.existsSync(path)) {
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            const row = (data.telemetry?.results ?? data.seedTelemetry ?? [])[0];
            if (row) out = {
              id,
              radius:Number(radius),
              speed:Number(speed),
              seed:Number(seed),
              telemetry:true,
              launchSpeedMetersPerSecond:row.launchSpeedMetersPerSecond,
              lapCount:row.lapCount,
              continuousOuterLapCount:row.continuousOuterLapCount,
              settled:row.settled,
              timedOut:row.timedOut,
              safetyPassed:row.safetyPassed,
              escaped:row.escaped,
              clipping:row.clipping,
              tunneling:row.tunneling,
              velocitySpike:row.velocitySpike,
              artificialAcceleration:row.artificialAcceleration,
              finalPocketNumber:row.finalPocketNumber,
              settleTime:row.settleTime
            };
          }
          console.log(JSON.stringify(out));
          NODE
          done

      - name: Summarize candidate
        env:
          CANDIDATE_ID: ${{ matrix.id }}
          RADIUS: ${{ matrix.radius }}
          SPEED: ${{ matrix.speed }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const id = process.env.CANDIDATE_ID;
          const rows = fs.readFileSync('part11-' + id + '.ndjson','utf8')
            .trim().split(/\n+/).filter(Boolean).map(JSON.parse);
          const valid = rows.filter(r => r.telemetry);
          if (valid.length !== 5) throw new Error(id + ': expected 5 telemetry rows, got ' + valid.length);
          const laps = valid.map(r => Number(r.lapCount)).sort((a,b)=>a-b);
          const safe = valid.every(r =>
            r.settled && !r.timedOut && r.safetyPassed &&
            !r.escaped && !r.clipping && !r.tunneling &&
            !r.velocitySpike && !r.artificialAcceleration &&
            r.finalPocketNumber != null
          );
          const summary = {
            id,
            radius:Number(process.env.RADIUS),
            speedBaseMps:Number(process.env.SPEED),
            safe,
            minLap:laps[0],
            medianLap:laps[2],
            maxLap:laps[4],
            targetMinFiveLaps:safe && laps[0] >= 5,
            rows:valid
          };
          console.log('PART11_CANDIDATE_SUMMARY ' + JSON.stringify(summary));
          fs.writeFileSync('part11-' + id + '-summary.json', JSON.stringify(summary,null,2));
          NODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roulette-part11-${{ matrix.id }}
          path: |
            artifacts/roulette-physics-lab/part11-${{ matrix.id }}/
            part11-${{ matrix.id }}*.json
            part11-${{ matrix.id }}*.ndjson
            part11-${{ matrix.id }}-*.log
            /tmp/roulette-part11-${{ matrix.id }}.log
          if-no-files-found: warn
