name: Roulette Part 11 Wall Hug Launch Probe

on:
  push:
    branches:
      - feature/roulette
    paths:
      - '.github/workflows/roulette-part11-wall-hug-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        speed: ['5.00', '5.50', '6.00']

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: Enable test-only wall-hug radius
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path("artifacts/roulette-physics-lab/src/Part2SceneViewport.tsx")
          text = path.read_text()
          old = "THREE.MathUtils.clamp(requestedPart11LaunchRadius, 2.34, 2.50)"
          new = "THREE.MathUtils.clamp(requestedPart11LaunchRadius, 2.34, 2.54)"
          if old not in text:
              raise SystemExit("expected Part 11 radius clamp not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - run: pnpm run typecheck:libs
      - run: pnpm --filter @workspace/roulette-physics-lab run typecheck

      - name: Start physics lab
        run: |
          PORT=4173 BASE_PATH=/ pnpm --filter @workspace/roulette-physics-lab run dev > /tmp/roulette-part11-wallhug-${{ matrix.speed }}.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/roulette-part11-wallhug-${{ matrix.speed }}.log
          exit 1

      - name: Run two difficult seeds
        env:
          SPEED: ${{ matrix.speed }}
        shell: bash
        run: |
          set -u
          : > "part11-wallhug-${SPEED}.ndjson"
          for spec in 61007:6 61014:13; do
            SEED="${spec%%:*}"
            START="${spec##*:}"
            OUT="part11-wallhug-${SPEED}-${SEED}.json"
            LOG="part11-wallhug-${SPEED}-${SEED}.log"

            ROULETTE_LAB_URL="http://127.0.0.1:4173/?part6Headless=1&part6SeedStartIndex=${START}&part6SeedCount=1&part6MaxDurationSeconds=30&part11Calibration=1&part11LaunchRadius=2.531&part11LaunchSpeedMps=${SPEED}&part11BallScale=0.70&part11SpinFactor=1.0&part11TrackFriction=0.028" \
            ROULETTE_PART6_OUTPUT="${OUT}" \
            ROULETTE_PART6_TIMEOUT_MS='150000' \
            ROULETTE_PART6_EXPECTED_SEEDS='1' \
            node scripts/roulette-part6-runtime.mjs > "${LOG}" 2>&1 || true

            node - "${LOG}" "${SEED}" "${OUT}" "${SPEED}" <<'NODE' | tee -a "part11-wallhug-${SPEED}.ndjson"
          const fs = require('fs');
          const [logPath, seed, outPath, speed] = process.argv.slice(2);
          const frames = [];
          if (fs.existsSync(logPath)) {
            for (const line of fs.readFileSync(logPath,'utf8').split(/\n+/)) {
              const marker='BROWSER_CONSOLE ';
              const at=line.indexOf(marker);
              if(at<0) continue;
              try {
                const outer=JSON.parse(line.slice(at+marker.length));
                const text=String(outer.text??'');
                const prefix='ROULETTE_PARITY_STEP ';
                if(text.startsWith(prefix)) frames.push(JSON.parse(text.slice(prefix.length)));
              } catch {}
            }
          }
          let row=null;
          if(fs.existsSync(outPath)){
            const data=JSON.parse(fs.readFileSync(outPath,'utf8'));
            row=(data.telemetry?.results ?? data.seedTelemetry ?? [])[0] ?? null;
          }
          const first=frames[0]??null;
          let firstReversal=null;
          for(let i=1;i<frames.length;i++){
            const prev=frames[i-1],cur=frames[i];
            if(Number(prev.radialVelocity)>0 && Number(cur.radialVelocity)<=0){
              firstReversal={before:prev,after:cur}; break;
            }
          }
          console.log(JSON.stringify({
            speedMps:Number(speed),
            seed:Number(seed),
            telemetry:Boolean(row),
            firstStep:first ? {
              step:first.step,
              radius:first.radius,
              radialVelocity:first.radialVelocity,
              speed:first.speed,
              wallClearance:2.558-Number(first.radius)-0.0392
            } : null,
            lapCount:row?.lapCount ?? null,
            trackDuration:row?.trackDuration ?? null,
            inwardTransitionTime:row?.inwardTransitionTime ?? null,
            maxRadius:row?.maxRadius ?? null,
            settled:row?.settled ?? null,
            timedOut:row?.timedOut ?? null,
            safetyPassed:row?.safetyPassed ?? null,
            escaped:row?.escaped ?? null,
            clipping:row?.clipping ?? null,
            tunneling:row?.tunneling ?? null,
            velocitySpike:row?.velocitySpike ?? null,
            artificialAcceleration:row?.artificialAcceleration ?? null,
            finalPocketNumber:row?.finalPocketNumber ?? null,
            reversalBeforeRadial:firstReversal?.before?.radialVelocity ?? null,
            reversalAfterRadial:firstReversal?.after?.radialVelocity ?? null,
            reversalBeforeSlip:firstReversal?.before?.trackContactSlipSpeed ?? null
          }));
          NODE
          done

      - name: Summarize wall-hug speed
        env:
          SPEED: ${{ matrix.speed }}
        run: |
          node <<'NODE'
          const fs=require('fs');
          const speed=process.env.SPEED;
          const rows=fs.readFileSync('part11-wallhug-'+speed+'.ndjson','utf8')
            .trim().split(/\n+/).filter(Boolean).map(JSON.parse);
          if(rows.length!==2 || rows.some(r=>!r.telemetry)) throw new Error(speed+': expected 2 rows');
          console.log('PART11_WALL_HUG_SUMMARY '+JSON.stringify({
            speedMps:Number(speed),
            minLap:Math.min(...rows.map(r=>Number(r.lapCount))),
            maxLap:Math.max(...rows.map(r=>Number(r.lapCount))),
            maxInitialWallGap:Math.max(...rows.map(r=>Math.abs(Number(r.firstStep?.wallClearance ?? 999)))),
            allSafe:rows.every(r=>
              r.settled && !r.timedOut && r.safetyPassed &&
              !r.escaped && !r.clipping && !r.tunneling &&
              !r.velocitySpike && !r.artificialAcceleration &&
              r.finalPocketNumber!=null
            ),
            rows
          }));
          NODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roulette-part11-wallhug-${{ matrix.speed }}
          path: |
            part11-wallhug-${{ matrix.speed }}*
            /tmp/roulette-part11-wallhug-${{ matrix.speed }}.log
          if-no-files-found: warn
