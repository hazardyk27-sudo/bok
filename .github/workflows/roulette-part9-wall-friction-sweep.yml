name: Roulette Part 9 Exact Wall Friction Sweep

on:
  push:
    branches:
      - feature/roulette
    paths:
      - '.github/workflows/roulette-part9-wall-friction-sweep.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - wallFriction: 0
          - wallFriction: 0.001
          - wallFriction: 0.003
          - wallFriction: 0.006

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build TypeScript project references
        run: pnpm run typecheck:libs
      - name: Typecheck roulette physics lab
        run: pnpm --filter @workspace/roulette-physics-lab run typecheck
      - name: Start roulette physics lab
        run: |
          PORT=4173 BASE_PATH=/ pnpm --filter @workspace/roulette-physics-lab run dev > /tmp/roulette-part9-wall.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/roulette-part9-wall.log
          exit 1
      - name: Run wall friction candidate
        env:
          WALL_FRICTION: ${{ matrix.wallFriction }}
        run: |
          tag="wf$WALL_FRICTION"
          ROULETTE_LAB_URL="http://127.0.0.1:4173/?part6Headless=1&part6SeedStartIndex=6&part6SeedCount=1&part6MaxDurationSeconds=20&part9Calibration=1&part9LaunchRadius=2.46&part9LaunchSpeedMps=5.5&part9TrackFriction=0.028&part9LaunchGap=0.01&part9SpinFactor=1.0&part9StationaryMode=baseline&part9StationaryRestitution=0.01&part9WallSplit=1&part9WallFriction=$WALL_FRICTION&part9WallRadiusMin=2.48&part9WallNormalYMax=0.45" \
          ROULETTE_PART6_OUTPUT="artifacts/roulette-physics-lab/part9-wall-$tag.json" \
          ROULETTE_PART6_TIMEOUT_MS='120000' \
          ROULETTE_PART6_EXPECTED_SEEDS='1' \
          node scripts/roulette-part6-runtime.mjs > "part9-wall-$tag.log" 2>&1

          node -e '
            const fs=require("fs");
            const wallFriction=Number(process.env.WALL_FRICTION);
            const tag="wf"+process.env.WALL_FRICTION;
            const data=JSON.parse(fs.readFileSync("artifacts/roulette-physics-lab/part9-wall-"+tag+".json","utf8"));
            const row=(data.telemetry?.results ?? data.seedTelemetry ?? [])[0];
            if(!row) throw new Error("missing telemetry");
            console.log("PART9_WALL_CASE "+JSON.stringify({
              wallFriction,
              seed:row.seed,
              gatedLapCount:row.lapCount,
              continuousOuterLapCount:row.continuousOuterLapCount,
              trackDuration:row.trackDuration,
              trackStartSpeed:row.trackStartSpeed,
              trackEndSpeed:row.trackEndSpeed,
              settled:row.settled,
              timedOut:row.timedOut,
              safetyPassed:row.safetyPassed,
              escaped:row.escaped,
              clipping:row.clipping,
              tunneling:row.tunneling,
              velocitySpike:row.velocitySpike,
              artificialAcceleration:row.artificialAcceleration,
              settleTime:row.settleTime,
              finalPocketNumber:row.finalPocketNumber,
              inTargetBand:row.continuousOuterLapCount>=4&&row.continuousOuterLapCount<=5
            }));
          '

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roulette-part9-wall-${{ matrix.wallFriction }}
          path: |
            artifacts/roulette-physics-lab/part9-wall-*.json
            part9-wall-*.log
            /tmp/roulette-part9-wall.log
          if-no-files-found: warn
