name: Roulette 7 Seed Settle Gate

on:
  push:
    branches:
      - feature/roulette
    paths:
      - '.github/workflows/roulette-6seed-settle-gate.yml'
  workflow_dispatch:

jobs:
  settle-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed: 61001
            start: 0
          - seed: 61004
            start: 3
          - seed: 61005
            start: 4
          - seed: 61006
            start: 5
          - seed: 61007
            start: 6
          - seed: 61008
            start: 7
          - seed: 61022
            start: 21

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build TypeScript project references
        run: pnpm run typecheck:libs

      - name: Typecheck roulette physics lab
        run: pnpm --filter @workspace/roulette-physics-lab run typecheck

      - name: Start roulette physics lab
        shell: bash
        run: |
          PORT=4173 BASE_PATH=/ pnpm --filter @workspace/roulette-physics-lab run dev > /tmp/roulette-settle-${{ matrix.seed }}.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/roulette-settle-${{ matrix.seed }}.log
          exit 1

      - name: Run settle seed
        env:
          SEED: ${{ matrix.seed }}
          START_INDEX: ${{ matrix.start }}
        shell: bash
        run: |
          set -euo pipefail
          ROULETTE_LAB_URL="http://127.0.0.1:4173/?part6Headless=1&part6SeedStartIndex=$START_INDEX&part6SeedCount=1&part6MaxDurationSeconds=20" \
          ROULETTE_PART6_OUTPUT="artifacts/roulette-physics-lab/settle-gate-$SEED.json" \
          ROULETTE_PART6_TIMEOUT_MS='120000' \
          ROULETTE_PART6_EXPECTED_SEEDS='1' \
          node scripts/roulette-part6-runtime.mjs > "settle-gate-$SEED.log" 2>&1

          node - "$SEED" <<'NODE'
          const fs = require('fs');
          const seed = Number(process.argv[2]);
          const data = JSON.parse(fs.readFileSync(
            'artifacts/roulette-physics-lab/settle-gate-' + seed + '.json',
            'utf8',
          ));
          const rows = data.telemetry?.results ?? data.seedTelemetry ?? [];
          if (rows.length !== 1) throw new Error('Expected one row for ' + seed);
          const row = rows[0];
          const out = {
            seed: row.seed,
            settled: row.settled,
            timedOut: row.timedOut,
            settleTime: row.settleTime,
            finalPocketNumber: row.finalPocketNumber,
            finalPocketIndex: row.finalPocketIndex,
            finalSpeed: row.finalSpeed,
            finalRotorRelativeSpeed: row.finalRotorRelativeSpeed,
            lapCount: row.lapCount,
            peakSpeed: row.peakSpeed,
            velocitySpike: row.velocitySpike,
            artificialAcceleration: row.artificialAcceleration,
            escaped: row.escaped,
            clipping: row.clipping,
            tunneling: row.tunneling,
          };
          console.log('SETTLE_GATE_RESULT ' + JSON.stringify(out));
          if (!row.settled || row.timedOut) {
            throw new Error('Settle gate failed for seed ' + row.seed);
          }
          if (row.finalPocketIndex == null || row.finalPocketNumber == null) {
            throw new Error('Missing final pocket result for seed ' + row.seed);
          }
          if (row.velocitySpike || row.artificialAcceleration) {
            throw new Error('Spike regression for seed ' + row.seed);
          }
          if (row.escaped || row.clipping || row.tunneling) {
            throw new Error('Containment regression for seed ' + row.seed);
          }
          NODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roulette-6seed-settle-${{ matrix.seed }}
          path: |
            artifacts/roulette-physics-lab/settle-gate-${{ matrix.seed }}.json
            settle-gate-${{ matrix.seed }}.log
            /tmp/roulette-settle-${{ matrix.seed }}.log
          if-no-files-found: warn
