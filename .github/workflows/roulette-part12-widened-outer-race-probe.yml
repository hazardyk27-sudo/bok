name: Roulette Part 12 Widened Outer Race Probe

on:
  push:
    branches:
      - feature/roulette
    paths:
      - '.github/workflows/roulette-part12-widened-outer-race-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        speed: ['5.00', '5.50']

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: Widen visual GLB outer race in test workspace
        run: |
          node artifacts/roulette-physics-lab/scripts/widen-outer-race-glb.mjs \
            artifacts/roulette-physics-lab/public/rou-lp-test-04.glb \
            artifacts/roulette-physics-lab/public/rou-lp-test-04.glb
          cp artifacts/roulette-physics-lab/public/rou-lp-test-04.glb \
            artifacts/cascade-8/src/roulette/assets/rou-lp-test-04.glb
          python <<'PY'
          from pathlib import Path
          p=Path('lib/roulette-physics-config.ts')
          s=p.read_text()
          old='export const ROULETTE_DARK_RACE_RADIUS_BAND = [2.27, 2.54] as const;'
          new='export const ROULETTE_DARK_RACE_RADIUS_BAND = [2.27, 2.65] as const;'
          if old not in s:
              raise SystemExit('expected dark-race radius band not found')
          p.write_text(s.replace(old,new,1))
          PY
          sha256sum artifacts/roulette-physics-lab/public/rou-lp-test-04.glb

      - run: pnpm run typecheck:libs
      - run: pnpm --filter @workspace/roulette-physics-lab run typecheck

      - name: Start widened physics lab
        run: |
          PORT=4173 BASE_PATH=/ pnpm --filter @workspace/roulette-physics-lab run dev > /tmp/roulette-part12-wide-${{ matrix.speed }}.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/roulette-part12-wide-${{ matrix.speed }}.log
          exit 1

      - name: Run two difficult seeds on widened GLB
        env:
          SPEED: ${{ matrix.speed }}
        shell: bash
        run: |
          set -u
          : > "part12-wide-${SPEED}.ndjson"
          for spec in 61007:6 61014:13; do
            SEED="${spec%%:*}"
            START="${spec##*:}"
            OUT="part12-wide-${SPEED}-${SEED}.json"
            LOG="part12-wide-${SPEED}-${SEED}.log"

            ROULETTE_LAB_URL="http://127.0.0.1:4173/?part6Headless=1&part6SeedStartIndex=${START}&part6SeedCount=1&part6MaxDurationSeconds=35&part11Calibration=1&part11LaunchRadius=2.39&part11LaunchSpeedMps=${SPEED}&part11BallScale=1.00&part11SpinFactor=1.0&part11TrackFriction=0.028" \
            ROULETTE_PART6_OUTPUT="${OUT}" \
            ROULETTE_PART6_TIMEOUT_MS='180000' \
            ROULETTE_PART6_EXPECTED_SEEDS='1' \
            node scripts/roulette-part6-runtime.mjs > "${LOG}" 2>&1 || true

            node - "${LOG}" "${SEED}" "${OUT}" "${SPEED}" <<'NODE' | tee -a "part12-wide-${SPEED}.ndjson"
          const fs=require('fs');
          const [logPath,seed,outPath,speed]=process.argv.slice(2);
          let exact=null;
          if(fs.existsSync(logPath)){
            for(const line of fs.readFileSync(logPath,'utf8').split(/\n+/)){
              const marker='BROWSER_CONSOLE ';
              const at=line.indexOf(marker);
              if(at<0) continue;
              try{
                const outer=JSON.parse(line.slice(at+marker.length));
                const text=String(outer.text??'');
                if(text.startsWith('GLB_EXACT_STATIONARY_COLLIDER ')){
                  exact=JSON.parse(text.slice('GLB_EXACT_STATIONARY_COLLIDER '.length));
                }
              }catch{}
            }
          }
          let row=null;
          if(fs.existsSync(outPath)){
            const data=JSON.parse(fs.readFileSync(outPath,'utf8'));
            row=(data.telemetry?.results ?? data.seedTelemetry ?? [])[0] ?? null;
          }
          console.log(JSON.stringify({
            speedMps:Number(speed),
            seed:Number(seed),
            telemetry:Boolean(row),
            exactCollider:exact,
            lapCount:row?.lapCount ?? null,
            trackDuration:row?.trackDuration ?? null,
            inwardTransitionTime:row?.inwardTransitionTime ?? null,
            minRadius:row?.minRadius ?? null,
            maxRadius:row?.maxRadius ?? null,
            settled:row?.settled ?? null,
            timedOut:row?.timedOut ?? null,
            safetyPassed:row?.safetyPassed ?? null,
            escaped:row?.escaped ?? null,
            clipping:row?.clipping ?? null,
            tunneling:row?.tunneling ?? null,
            velocitySpike:row?.velocitySpike ?? null,
            artificialAcceleration:row?.artificialAcceleration ?? null,
            finalPocketNumber:row?.finalPocketNumber ?? null
          }));
          NODE
          done

      - name: Summarize
        env:
          SPEED: ${{ matrix.speed }}
        run: |
          node <<'NODE'
          const fs=require('fs');
          const speed=process.env.SPEED;
          const rows=fs.readFileSync('part12-wide-'+speed+'.ndjson','utf8')
            .trim().split(/\n+/).filter(Boolean).map(JSON.parse);
          if(rows.length!==2 || rows.some(r=>!r.telemetry || !r.exactCollider)) {
            throw new Error(speed+': expected complete telemetry and exact collider evidence');
          }
          console.log('PART12_WIDENED_OUTER_RACE_SUMMARY '+JSON.stringify({
            speedMps:Number(speed),
            minLap:Math.min(...rows.map(r=>Number(r.lapCount))),
            maxLap:Math.max(...rows.map(r=>Number(r.lapCount))),
            allSafe:rows.every(r=>
              r.settled && !r.timedOut &&
              !r.escaped && !r.clipping && !r.tunneling &&
              !r.velocitySpike && !r.artificialAcceleration
            ),
            rows
          }));
          NODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roulette-part12-wide-${{ matrix.speed }}
          path: |
            part12-wide-${{ matrix.speed }}*
            /tmp/roulette-part12-wide-${{ matrix.speed }}.log
          if-no-files-found: warn
