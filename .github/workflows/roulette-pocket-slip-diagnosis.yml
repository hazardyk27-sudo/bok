name: Roulette Pocket Slip Diagnosis

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed: 61004
            start: 3
          - seed: 61005
            start: 4
          - seed: 61006
            start: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build TypeScript project references
        run: pnpm run typecheck:libs

      - name: Typecheck roulette physics lab
        run: pnpm --filter @workspace/roulette-physics-lab run typecheck

      - name: Start roulette physics lab
        shell: bash
        run: |
          PORT=4173 BASE_PATH=/ pnpm --filter @workspace/roulette-physics-lab run dev > /tmp/roulette-slip-${{ matrix.seed }}.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/roulette-slip-${{ matrix.seed }}.log
          exit 1

      - name: Run pocket slip diagnosis
        env:
          SEED: ${{ matrix.seed }}
          START_INDEX: ${{ matrix.start }}
        shell: bash
        run: |
          set -euo pipefail
          ROULETTE_LAB_URL="http://127.0.0.1:4173/?part6Headless=1&part6SeedStartIndex=$START_INDEX&part6SeedCount=1&part6MaxDurationSeconds=20" \
          ROULETTE_PART6_OUTPUT="artifacts/roulette-physics-lab/pocket-slip-$SEED.json" \
          ROULETTE_PART6_TIMEOUT_MS='120000' \
          ROULETTE_PART6_EXPECTED_SEEDS='1' \
          node scripts/roulette-part6-runtime.mjs > "pocket-slip-$SEED.log" 2>&1

          grep 'PART6_POCKET_SLIP_TRACE' "pocket-slip-$SEED.log" || true

          node - "$SEED" <<'NODE'
          const fs = require('fs');
          const seed = Number(process.argv[2]);
          const data = JSON.parse(fs.readFileSync(
            'artifacts/roulette-physics-lab/pocket-slip-' + seed + '.json',
            'utf8',
          ));
          const rows = data.telemetry?.results ?? data.seedTelemetry ?? [];
          if (rows.length !== 1) throw new Error('Expected one row for ' + seed);
          const row = rows[0];
          console.log('POCKET_SLIP_RESULT ' + JSON.stringify({
            seed: row.seed,
            settled: row.settled,
            timedOut: row.timedOut,
            settleTime: row.settleTime,
            finalPocketNumber: row.finalPocketNumber,
            finalSpeed: row.finalSpeed,
            finalRotorRelativeSpeed: row.finalRotorRelativeSpeed,
            velocitySpike: row.velocitySpike,
            artificialAcceleration: row.artificialAcceleration,
          }));
          NODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roulette-pocket-slip-${{ matrix.seed }}
          path: |
            artifacts/roulette-physics-lab/pocket-slip-${{ matrix.seed }}.json
            pocket-slip-${{ matrix.seed }}.log
          if-no-files-found: warn
