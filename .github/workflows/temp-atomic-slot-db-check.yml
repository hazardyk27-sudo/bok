name: Temporary Atomic Slot DB Check

on:
  push:
    branches:
      - feature/slot
    paths:
      - .github/workflows/temp-atomic-slot-db-check.yml
      - artifacts/api-server/src/slot/repository.ts

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: slot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d slot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/slot_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create minimal Slot tables
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d slot_test <<'SQL'
          CREATE TABLE roulette_wallets (
            session_id text PRIMARY KEY,
            balance_cents integer NOT NULL,
            updated_at timestamptz NOT NULL DEFAULT now()
          );
          CREATE TABLE slot_rounds (
            id text PRIMARY KEY,
            session_id text NOT NULL,
            stake_cents integer NOT NULL,
            payout_cents integer NOT NULL,
            result jsonb NOT NULL,
            idempotency_key text NOT NULL UNIQUE,
            created_at timestamptz NOT NULL DEFAULT now()
          );
          CREATE TABLE slot_ledger (
            id text PRIMARY KEY,
            session_id text NOT NULL,
            round_id text NOT NULL,
            kind text NOT NULL,
            amount_cents integer NOT NULL,
            idempotency_key text NOT NULL UNIQUE,
            created_at timestamptz NOT NULL DEFAULT now()
          );
          CREATE TABLE slot_wallet_migrations (
            id text PRIMARY KEY,
            session_id text NOT NULL UNIQUE,
            legacy_balance_cents integer NOT NULL,
            disposition text NOT NULL,
            created_at timestamptz NOT NULL DEFAULT now()
          );
          SQL
      - name: Exercise atomic Slot settlement
        run: |
          cat > artifacts/api-server/src/slot/tempAtomicIntegration.ts <<'TS'
          import { pool } from "@workspace/db";
          import { slotRepository } from "./repository";
          import { FREE_BET_CENTS } from "../../../cascade-8/src/config/GameConfig";
          import { INITIAL_ROULETTE_BALANCE_CENTS } from "../roulette/types";

          const session = "atomic-session-main-0001";
          const paidKey = "atomic-paid-key-000001";
          const before = await slotRepository.getState(session);
          const paid = await slotRepository.spin(session, { stakeCents: 20, idempotencyKey: paidKey });
          const duplicate = await slotRepository.spin(session, { stakeCents: 20, idempotencyKey: paidKey });
          if (duplicate.roundId !== paid.roundId) throw new Error("duplicate round mismatch");
          if (duplicate.wallet.balanceCents !== paid.wallet.balanceCents) throw new Error("duplicate wallet mismatch");

          const free = await slotRepository.spin(session, {
            stakeCents: FREE_BET_CENTS,
            idempotencyKey: "atomic-free-key-000001",
          });
          if (!Number.isInteger(free.wallet.balanceCents)) throw new Error("invalid free wallet");

          const reusedSession = "atomic-session-other-0002";
          let reusedError = "";
          try {
            await slotRepository.spin(reusedSession, { stakeCents: 20, idempotencyKey: paidKey });
          } catch (e) {
            reusedError = e instanceof Error ? e.message : String(e);
          }
          if (reusedError !== "IDEMPOTENCY_KEY_REUSED") throw new Error("reused idempotency not rejected");

          const lowSession = "atomic-session-low-000003";
          await pool.query(
            "INSERT INTO roulette_wallets(session_id,balance_cents) VALUES($1,5)",
            [lowSession],
          );
          let insufficient = "";
          try {
            await slotRepository.spin(lowSession, {
              stakeCents: 20,
              idempotencyKey: "atomic-low-key-0000001",
            });
          } catch (e) {
            insufficient = e instanceof Error ? e.message : String(e);
          }
          if (insufficient !== "INSUFFICIENT_SLOT_CREDITS") throw new Error("insufficient funds not rejected");
          const lowCheck = await pool.query("SELECT balance_cents FROM roulette_wallets WHERE session_id=$1", [lowSession]);
          if (Number(lowCheck.rows[0]?.balance_cents) !== 5) throw new Error("insufficient spin changed wallet");
          const lowRounds = await pool.query("SELECT count(*)::int AS count FROM slot_rounds WHERE session_id=$1", [lowSession]);
          if (Number(lowRounds.rows[0]?.count) !== 0) throw new Error("insufficient spin created round");

          const sameKeySession = "atomic-concurrent-same-key";
          const sameKey = "atomic-concurrent-key001";
          const same = await Promise.all([
            slotRepository.spin(sameKeySession, { stakeCents: 20, idempotencyKey: sameKey }),
            slotRepository.spin(sameKeySession, { stakeCents: 20, idempotencyKey: sameKey }),
          ]);
          if (same[0].roundId !== same[1].roundId) throw new Error("concurrent same key created two rounds");
          const sameRounds = await pool.query("SELECT count(*)::int AS count FROM slot_rounds WHERE session_id=$1", [sameKeySession]);
          if (Number(sameRounds.rows[0]?.count) !== 1) throw new Error("concurrent same key round count wrong");

          const concurrentSession = "atomic-concurrent-diff-key";
          const [c1,c2] = await Promise.all([
            slotRepository.spin(concurrentSession, { stakeCents: 20, idempotencyKey: "atomic-different-key001" }),
            slotRepository.spin(concurrentSession, { stakeCents: 20, idempotencyKey: "atomic-different-key002" }),
          ]);
          const expected = INITIAL_ROULETTE_BALANCE_CENTS - 40 + c1.result.totalWinCents + c2.result.totalWinCents;
          const concurrentWallet = await pool.query("SELECT balance_cents FROM roulette_wallets WHERE session_id=$1", [concurrentSession]);
          if (Number(concurrentWallet.rows[0]?.balance_cents) !== expected) throw new Error("concurrent wallet accounting mismatch");

          const ledger = await pool.query(
            "SELECT kind, count(*)::int AS count FROM slot_ledger WHERE session_id=$1 GROUP BY kind ORDER BY kind",
            [session],
          );
          const stakeCount = Number(ledger.rows.find((r) => r.kind === "STAKE_DEBIT")?.count ?? 0);
          const payoutCount = Number(ledger.rows.find((r) => r.kind === "PAYOUT_CREDIT")?.count ?? 0);
          if (stakeCount !== 1 || payoutCount !== 2) throw new Error("ledger counts wrong");

          console.log("ATOMIC_SLOT_DB_OK", {
            before: before.wallet.balanceCents,
            paid: paid.wallet.balanceCents,
            free: free.wallet.balanceCents,
            stakeCount,
            payoutCount,
          });
          await pool.end();
          TS
          pnpm exec tsx artifacts/api-server/src/slot/tempAtomicIntegration.ts
