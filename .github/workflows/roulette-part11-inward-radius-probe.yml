name: Roulette Part 11 Inward Radius Probe

on:
  push:
    branches:
      - feature/roulette
    paths:
      - '.github/workflows/roulette-part11-inward-radius-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        radius: ['2.34', '2.36', '2.38']

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run typecheck:libs
      - run: pnpm --filter @workspace/roulette-physics-lab run typecheck

      - name: Start physics lab
        run: |
          PORT=4173 BASE_PATH=/ pnpm --filter @workspace/roulette-physics-lab run dev > /tmp/roulette-part11-inward-radius-${{ matrix.radius }}.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/roulette-part11-inward-radius-${{ matrix.radius }}.log
          exit 1

      - name: Run two difficult seeds
        env:
          RADIUS: ${{ matrix.radius }}
        shell: bash
        run: |
          set -u
          : > "part11-inward-radius-${RADIUS}.ndjson"
          for spec in 61007:6 61014:13; do
            SEED="${spec%%:*}"
            START="${spec##*:}"
            OUT="part11-inward-radius-${RADIUS}-${SEED}.json"
            LOG="part11-inward-radius-${RADIUS}-${SEED}.log"

            ROULETTE_LAB_URL="http://127.0.0.1:4173/?part6Headless=1&part6SeedStartIndex=${START}&part6SeedCount=1&part6MaxDurationSeconds=30&part11Calibration=1&part11LaunchRadius=${RADIUS}&part11LaunchSpeedMps=5.00&part11BallScale=0.70&part11SpinFactor=1.0" \
            ROULETTE_PART6_OUTPUT="${OUT}" \
            ROULETTE_PART6_TIMEOUT_MS='150000' \
            ROULETTE_PART6_EXPECTED_SEEDS='1' \
            node scripts/roulette-part6-runtime.mjs > "${LOG}" 2>&1 || true

            node - "${LOG}" "${SEED}" "${OUT}" "${RADIUS}" <<'NODE' | tee -a "part11-inward-radius-${RADIUS}.ndjson"
          const fs = require('fs');
          const [logPath, seed, outPath, radius] = process.argv.slice(2);
          const frames = [];
          if (fs.existsSync(logPath)) {
            for (const line of fs.readFileSync(logPath, 'utf8').split(/\n+/)) {
              const marker = 'BROWSER_CONSOLE ';
              const at = line.indexOf(marker);
              if (at < 0) continue;
              try {
                const outer = JSON.parse(line.slice(at + marker.length));
                const text = String(outer.text ?? '');
                const prefix = 'ROULETTE_PARITY_STEP ';
                if (text.startsWith(prefix)) frames.push(JSON.parse(text.slice(prefix.length)));
              } catch {}
            }
          }
          let reversal = null;
          for (let i = 1; i < frames.length; i++) {
            const prev = frames[i - 1], cur = frames[i];
            if (Number(prev.radius) >= 2.45 &&
                Number(prev.radialVelocity) > 0 &&
                Number(cur.radialVelocity) <= 0) {
              reversal = { before: prev, after: cur };
              break;
            }
          }

          let row = null;
          if (fs.existsSync(outPath)) {
            const data = JSON.parse(fs.readFileSync(outPath, 'utf8'));
            row = (data.telemetry?.results ?? data.seedTelemetry ?? [])[0] ?? null;
          }

          const out = {
            launchRadius:Number(radius),
            seed:Number(seed),
            telemetry:Boolean(row),
            lapCount:row?.lapCount ?? null,
            trackDuration:row?.trackDuration ?? null,
            inwardTransitionTime:row?.inwardTransitionTime ?? null,
            maxRadius:row?.maxRadius ?? null,
            settled:row?.settled ?? null,
            timedOut:row?.timedOut ?? null,
            safetyPassed:row?.safetyPassed ?? null,
            escaped:row?.escaped ?? null,
            clipping:row?.clipping ?? null,
            tunneling:row?.tunneling ?? null,
            velocitySpike:row?.velocitySpike ?? null,
            artificialAcceleration:row?.artificialAcceleration ?? null,
            finalPocketNumber:row?.finalPocketNumber ?? null,
            reversalBeforeSlip:reversal?.before?.trackContactSlipSpeed ?? null,
            reversalAfterSlip:reversal?.after?.trackContactSlipSpeed ?? null,
            reversalBeforeRadial:reversal?.before?.radialVelocity ?? null,
            reversalAfterRadial:reversal?.after?.radialVelocity ?? null
          };
          console.log(JSON.stringify(out));
          NODE
          done

      - name: Summarize radius
        env:
          RADIUS: ${{ matrix.radius }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const radius = process.env.RADIUS;
          const rows = fs.readFileSync('part11-inward-radius-' + radius + '.ndjson','utf8')
            .trim().split(/\n+/).filter(Boolean).map(JSON.parse);
          if (rows.length !== 2 || rows.some(r => !r.telemetry)) {
            throw new Error(radius + ': expected 2 telemetry rows');
          }
          const summary = {
            launchRadius:Number(radius),
            minLap:Math.min(...rows.map(r=>Number(r.lapCount))),
            maxLap:Math.max(...rows.map(r=>Number(r.lapCount))),
            maxReversalSlip:Math.max(...rows.map(r=>Number(r.reversalBeforeSlip ?? 0))),
            allSafe:rows.every(r =>
              r.settled && !r.timedOut && r.safetyPassed &&
              !r.escaped && !r.clipping && !r.tunneling &&
              !r.velocitySpike && !r.artificialAcceleration &&
              r.finalPocketNumber != null
            ),
            rows
          };
          console.log('PART11_RADIUS_SUMMARY ' + JSON.stringify(summary));
          NODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roulette-part11-inward-radius-${{ matrix.radius }}
          path: |
            part11-inward-radius-${{ matrix.radius }}*
            /tmp/roulette-part11-inward-radius-${{ matrix.radius }}.log
          if-no-files-found: warn
