name: Integration Preview Guard

on:
  push:
    branches:
      - integration/replit-preview
  pull_request:
    branches:
      - integration/replit-preview

jobs:
  verify-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build Cascade 8 hub
        run: pnpm --filter @workspace/cascade-8 run build

      - name: Blackjack backend regression
        run: pnpm --filter @workspace/api-server exec vitest run src/blackjack/domain.test.ts src/blackjack/rules.test.ts src/blackjack/shoe.test.ts src/blackjack/shuffle.test.ts src/blackjack/draw.test.ts src/blackjack/lifecycle.test.ts src/blackjack/shoeGate.test.ts src/blackjack/stateMachine.test.ts src/blackjack/seats.test.ts src/blackjack/participation.test.ts src/blackjack/initialDeal.test.ts src/blackjack/walletLedger.test.ts src/blackjack/reservations.test.ts src/blackjack/chips.test.ts src/blackjack/betting.test.ts src/blackjack/turnEngine.test.ts src/blackjack/hit.test.ts src/blackjack/stand.test.ts src/blackjack/double.test.ts src/blackjack/split.test.ts src/blackjack/dealer.test.ts src/blackjack/settlement.test.ts src/blackjack/publicSnapshot.test.ts src/blackjack/realtime.test.ts src/blackjack/actionQueue.test.ts src/blackjack/actionProtocol.test.ts src/blackjack/eventStream.test.ts src/blackjack/syncProtocol.test.ts src/blackjack/reconnect.test.ts src/blackjack/connectionPolicy.test.ts src/blackjack/snapshotState.test.ts src/blackjack/snapshotRepository.test.ts

      - name: Multi-game integration regression
        run: >
          PORT=4173 BASE_PATH=/
          pnpm --filter @workspace/cascade-8 exec vitest run
          src/hub/mainMenuRegression.test.ts
          src/slot/slotSmoke.test.ts
          src/cadi-kazan/cadiKazanSmoke.test.ts
          src/rouletteSmoke.test.ts
          src/rouletteGeometry.test.ts
          src/roulettePhysicsConfig.test.ts
          src/idle/idleUiIntegration.test.ts
          src/blackjack/blackjackSmoke.test.ts

      - name: Backend isolation regression
        run: pnpm --filter @workspace/api-server exec vitest run src/backendIsolation.test.ts

      - name: Dry-run isolated feature promotions
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin             feature/slot:refs/remotes/origin/feature/slot             feature/roulette:refs/remotes/origin/feature/roulette             feature/cadi-kazan:refs/remotes/origin/feature/cadi-kazan             feature/idle:refs/remotes/origin/feature/idle             feature/hub:refs/remotes/origin/feature/hub             feature/account:refs/remotes/origin/feature/account             feature/blackjack:refs/remotes/origin/feature/blackjack

          for game in slot roulette cadi-kazan idle hub account blackjack; do
            tmp="$(mktemp -d)"
            rmdir "$tmp"
            git worktree add --detach "$tmp" HEAD >/dev/null
            (
              cd "$tmp"
              GAME="$game" SOURCE_COMMIT="refs/remotes/origin/feature/$game" node scripts/promote-game.mjs
              git diff --check
            )
            git worktree remove --force "$tmp"
          done
