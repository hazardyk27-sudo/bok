name: Integration Preview Guard

on:
  push:
    branches:
      - integration/replit-preview
  pull_request:
    branches:
      - integration/replit-preview

jobs:
  classify-change:
    runs-on: ubuntu-latest
    outputs:
      broad_change: ${{ steps.scope.outputs.broad_change }}
      touched_games: ${{ steps.scope.outputs.touched_games }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify preview change
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"
          else
            base="$PUSH_BASE"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi

          git diff --name-only "$base" "$HEAD_SHA" > /tmp/preview-changed-files.txt
          cat /tmp/preview-changed-files.txt

          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require("fs");
          const manifest = JSON.parse(fs.readFileSync(".github/game-ownership.json", "utf8"));
          const files = fs.readFileSync("/tmp/preview-changed-files.txt", "utf8").split(/\r?\n/).filter(Boolean);
          const inside = (file, root) => file === root || file.startsWith(root.replace(/\/+$/, "") + "/");
          const touched = new Set();
          let shared = false;

          for (const file of files) {
            const owners = [];
            for (const [game, cfg] of Object.entries(manifest.games)) {
              const roots = [...(cfg.roots || []), ...(cfg.developmentRoots || [])];
              if (roots.some((root) => inside(file, root))) owners.push(game);
            }
            if (owners.length === 1) touched.add(owners[0]);
            else shared = true;
          }

          const broad = shared || touched.size !== 1;
          console.log("broad_change=" + (broad ? "true" : "false"));
          console.log("touched_games=" + [...touched].sort().join(","));
          NODE

  critical-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Production artifacts and platform contracts
        run: bash scripts/run-platform-critical-gate.sh

  broad-shared-gate:
    needs:
      - classify-change
      - critical-platform
    if: needs.classify-change.outputs.broad_change == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Workspace typecheck
        run: pnpm run typecheck
      - name: Cross-game shared/platform smoke
        run: bash scripts/run-cross-game-smoke.sh

  advisory-game-regressions:
    needs:
      - classify-change
      - critical-platform
    if: github.event_name == 'push'
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        game:
          - slot
          - cadi-kazan
          - idle
          - hub
          - account
          - roulette
          - blackjack
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Advisory ${{ matrix.game }} regression
        run: bash scripts/run-game-gate.sh "${{ matrix.game }}"

  advisory-workspace-typecheck:
    needs:
      - classify-change
      - critical-platform
    if: github.event_name == 'push' && needs.classify-change.outputs.broad_change != 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Advisory full workspace typecheck
        run: pnpm run typecheck
