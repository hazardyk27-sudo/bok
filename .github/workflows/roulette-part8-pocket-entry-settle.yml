name: Roulette Part 8 Pocket Entry And Settle

on:
  push:
    branches:
      - feature/roulette
    paths:
      - '.github/workflows/roulette-part8-pocket-entry-settle.yml'
      - 'artifacts/roulette-physics-lab/src/Part2SceneViewport.tsx'
      - 'artifacts/cascade-8/src/roulettePhysicsConfig.test.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript project references
        run: pnpm run typecheck:libs

      - name: Typecheck roulette physics lab
        run: pnpm --filter @workspace/roulette-physics-lab run typecheck

      - name: Verify pocket settle/result source contract
        run: |
          node <<'NODE'
          const fs = require('fs');
          const browser = fs.readFileSync(
            'artifacts/roulette-physics-lab/src/Part2SceneViewport.tsx',
            'utf8',
          );
          const required = [
            'finalRotorRelativeSpeed < 0.12',
            'settledFrames >= settleFramesRequired',
            'Math.atan2(\n                finalPosition.x,\n                finalPosition.z,\n              ) - rotorAngle',
            'pocketIndexFromLocalPosition(',
            "'exact-glb-rotor-trimesh'",
            'microParityRotorSamples',
            'pocketEntered',
            'pocketEntryTime',
          ];
          for (const token of required) {
            if (!browser.includes(token)) {
              throw new Error('Missing browser Part 8 contract token: ' + token);
            }
          }
          console.log('PART8_SOURCE_CONTRACT ' + JSON.stringify({
            relativeAngleResultMapping: true,
            stableLowSpeedSettle: true,
            exactRotorOnly: true,
          }));
          NODE

  browser-20-seed:
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        start: [0, 5, 10, 15]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build TypeScript project references
        run: pnpm run typecheck:libs

      - name: Typecheck roulette physics lab
        run: pnpm --filter @workspace/roulette-physics-lab run typecheck

      - name: Start roulette physics lab
        run: |
          PORT=4173 BASE_PATH=/ pnpm --filter @workspace/roulette-physics-lab run dev > /tmp/roulette-part8-${{ matrix.start }}.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/roulette-part8-${{ matrix.start }}.log
          exit 1

      - name: Verify browser five-seed pocket batch
        env:
          START_INDEX: ${{ matrix.start }}
        run: |
          set -euo pipefail
          ROULETTE_LAB_URL="http://127.0.0.1:4173/?part6Headless=1&part6SeedStartIndex=$START_INDEX&part6SeedCount=5&part6MaxDurationSeconds=30" \
          ROULETTE_PART6_OUTPUT="artifacts/roulette-physics-lab/part8-pocket-$START_INDEX.json" \
          ROULETTE_PART6_TIMEOUT_MS='240000' \
          ROULETTE_PART6_EXPECTED_SEEDS='5' \
          node scripts/roulette-part6-runtime.mjs > "part8-pocket-$START_INDEX.log" 2>&1

          node - "$START_INDEX" <<'NODE'
          const fs = require('fs');
          const start = process.argv[2];
          const data = JSON.parse(
            fs.readFileSync(
              'artifacts/roulette-physics-lab/part8-pocket-' + start + '.json',
              'utf8',
            ),
          );
          const rows = data.telemetry?.results ?? data.seedTelemetry ?? [];
          if (rows.length !== 5) throw new Error('Expected five Part 8 browser rows');

          for (const row of rows) {
            if (!row.pocketEntered || row.pocketEntryTime == null) {
              throw new Error(row.seed + ' never physically entered a pocket');
            }
            if (!row.settled || row.settleTime == null) {
              throw new Error(row.seed + ' did not stably settle');
            }
            if (row.finalPocketIndex == null || row.finalPocketNumber == null) {
              throw new Error(row.seed + ' missing final pocket result');
            }
            if (!(row.finalRotorRelativeSpeed < 0.12)) {
              throw new Error(row.seed + ' rotor-relative settle speed too high');
            }
            if (!row.microParityPassed || row.microParityRotorSamples < 1) {
              throw new Error(row.seed + ' exact rotor contact parity missing');
            }
            if (
              row.clipping ||
              row.tunneling ||
              row.escaped ||
              row.velocitySpike ||
              row.artificialAcceleration ||
              !row.safetyPassed
            ) {
              throw new Error(row.seed + ' Part 8 safety failure');
            }

            const phases = row.phases.map((event) => event.phase);
            const rotorEntry = phases.indexOf('ROTOR_ENTRY');
            const pocket = phases.indexOf('POCKET');
            const settled = phases.indexOf('SETTLED');
            if (!(rotorEntry >= 0 && pocket > rotorEntry && settled > pocket)) {
              throw new Error(row.seed + ' rotor/pocket/settled ordering invalid');
            }

            console.log('PART8_BROWSER_CASE ' + JSON.stringify({
              seed: row.seed,
              pocketEntryTime: row.pocketEntryTime,
              settleTime: row.settleTime,
              finalPocketIndex: row.finalPocketIndex,
              finalPocketNumber: row.finalPocketNumber,
              finalRotorRelativeSpeed: row.finalRotorRelativeSpeed,
              rotorContactSamples: row.microParityRotorSamples,
            }));
          }

          console.log('PART8_BROWSER_BATCH_PASS ' + JSON.stringify({
            startIndex: Number(start),
            seeds: rows.map((row) => row.seed),
            allPassed: true,
          }));
          NODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roulette-part8-pocket-${{ matrix.start }}
          path: |
            artifacts/roulette-physics-lab/part8-pocket-${{ matrix.start }}.json
            part8-pocket-${{ matrix.start }}.log
            /tmp/roulette-part8-${{ matrix.start }}.log
          if-no-files-found: warn
