name: Promote One Game To Replit Preview

on:
  workflow_dispatch:
    inputs:
      game:
        description: Game to promote
        required: true
        type: choice
        options:
          - slot
          - roulette
          - cadi-kazan
          - idle
          - hub
      source_ref:
        description: Isolated feature branch, tag, or commit to promote
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: replit-preview-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: integration/replit-preview
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Fetch source
        shell: bash
        run: git fetch origin "${{ inputs.source_ref }}"
      - name: Resolve source
        id: refs
        shell: bash
        run: |
          source_commit="$(git rev-parse FETCH_HEAD)"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
      - name: Copy only selected game ownership
        env:
          GAME: ${{ inputs.game }}
          SOURCE_COMMIT: ${{ steps.refs.outputs.source_commit }}
        run: node scripts/promote-game.mjs
      - name: Reject foreign changes and whitespace errors
        shell: bash
        run: |
          git diff --check
          echo "Changed files:"
          git diff --name-only
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build preview
        run: pnpm --filter @workspace/cascade-8 run build
      - name: Frontend integration regression
        run: >
          PORT=4173 BASE_PATH=/
          pnpm --filter @workspace/cascade-8 exec vitest run
          src/hub/mainMenuRegression.test.ts
          src/slot/slotSmoke.test.ts
          src/cadi-kazan/cadiKazanSmoke.test.ts
          src/rouletteSmoke.test.ts
          src/rouletteGeometry.test.ts
          src/roulettePhysicsConfig.test.ts
          src/idle/idleUiIntegration.test.ts
      - name: Backend isolation regression
        run: pnpm --filter @workspace/api-server exec vitest run src/backendIsolation.test.ts
      - name: Commit promotion
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No game changes to promote."
            exit 0
          fi
          git config user.name "OYUN Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "promote(${{ inputs.game }}): ${{ inputs.source_ref }}"
          git push origin HEAD:integration/replit-preview
