name: Promote One Game To Replit Preview

on:
  workflow_dispatch:
    inputs:
      game:
        description: Game to promote
        required: true
        type: choice
        options:
          - slot
          - roulette
          - cadi-kazan
          - idle
          - hub
          - account
          - blackjack
      source_ref:
        description: Exact 40-character feature commit SHA to promote (immutable; branch names are rejected)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: replit-preview-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: integration/replit-preview
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Record preview base
        id: preview_base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Validate immutable source SHA
        shell: bash
        run: |
          if [[ ! "${{ inputs.source_ref }}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Promotion source must be an exact 40-character commit SHA, not a branch/tag/moving ref."
            exit 2
          fi
      - name: Copy only selected game ownership
        env:
          GAME: ${{ inputs.game }}
          SOURCE_COMMIT: ${{ inputs.source_ref }}
        run: node scripts/promote-game.mjs
      - name: Reject foreign changes and whitespace errors
        shell: bash
        run: |
          git diff --check
          echo "Changed files:"
          git diff --name-only
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build preview
        run: pnpm --filter @workspace/cascade-8 run build

      - name: Blackjack backend regression
        run: pnpm --filter @workspace/api-server exec vitest run src/blackjack/domain.test.ts src/blackjack/rules.test.ts src/blackjack/shoe.test.ts src/blackjack/shuffle.test.ts src/blackjack/draw.test.ts src/blackjack/lifecycle.test.ts src/blackjack/shoeGate.test.ts src/blackjack/stateMachine.test.ts src/blackjack/seats.test.ts src/blackjack/participation.test.ts src/blackjack/initialDeal.test.ts src/blackjack/walletLedger.test.ts src/blackjack/reservations.test.ts src/blackjack/chips.test.ts src/blackjack/betting.test.ts src/blackjack/turnEngine.test.ts src/blackjack/hit.test.ts src/blackjack/stand.test.ts src/blackjack/double.test.ts src/blackjack/split.test.ts src/blackjack/dealer.test.ts src/blackjack/settlement.test.ts src/blackjack/publicSnapshot.test.ts src/blackjack/realtime.test.ts src/blackjack/actionQueue.test.ts src/blackjack/actionProtocol.test.ts src/blackjack/eventStream.test.ts src/blackjack/syncProtocol.test.ts src/blackjack/reconnect.test.ts src/blackjack/connectionPolicy.test.ts src/blackjack/snapshotState.test.ts src/blackjack/snapshotRepository.test.ts src/blackjack/journal.test.ts src/blackjack/journalRepository.test.ts src/blackjack/recovery.test.ts src/blackjack/botSimulation.test.ts src/blackjack/emptyTableLifecycle.test.ts src/blackjack/actionCoordinator.test.ts src/blackjack/clientSync.test.ts src/blackjack/multiclientSync.test.ts src/blackjack/realtimeActions.test.ts src/blackjack/websocketActions.test.ts src/blackjack/multiplayerGate.test.ts
      - name: Frontend integration regression
        run: >
          PORT=4173 BASE_PATH=/
          pnpm --filter @workspace/cascade-8 exec vitest run
          src/hub/mainMenuRegression.test.ts
          src/slot/slotSmoke.test.ts
          src/cadi-kazan/cadiKazanSmoke.test.ts
          src/rouletteSmoke.test.ts
          src/rouletteGeometry.test.ts
          src/roulettePhysicsConfig.test.ts
          src/idle/idleUiIntegration.test.ts
          src/blackjack/blackjackSmoke.test.ts
      - name: Backend isolation regression
        run: pnpm --filter @workspace/api-server exec vitest run src/backendIsolation.test.ts
      - name: Commit promotion locally
        id: promotion
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No game changes to promote."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "preview_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "OYUN Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "promote(${{ inputs.game }}): ${{ inputs.source_ref }}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "preview_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Re-check moving preview HEAD
        id: remote_preview
        shell: bash
        run: |
          git fetch origin integration/replit-preview:refs/remotes/origin/integration/replit-preview
          remote_sha="$(git rev-parse refs/remotes/origin/integration/replit-preview)"
          base_sha="${{ steps.preview_base.outputs.sha }}"
          echo "remote_sha=$remote_sha" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.promotion.outputs.changed }}" = "true" ] && [ "$remote_sha" != "$base_sha" ]; then
            echo "::error::PREVIEW_MOVED: integration/replit-preview changed from $base_sha to $remote_sha while this promotion was running. Do not merge it manually; re-run this same source SHA against the newest preview."
            exit 42
          fi
      - name: Push promotion
        if: steps.promotion.outputs.changed == 'true'
        shell: bash
        run: |
          git push origin HEAD:integration/replit-preview
          git fetch origin integration/replit-preview:refs/remotes/origin/integration/replit-preview
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse refs/remotes/origin/integration/replit-preview)"
          if [ "$local_sha" != "$remote_sha" ]; then
            echo "::error::Preview push verification failed. Local=$local_sha Remote=$remote_sha"
            exit 43
          fi
      - name: Promotion result
        shell: bash
        run: |
          git fetch origin integration/replit-preview:refs/remotes/origin/integration/replit-preview
          final_sha="$(git rev-parse refs/remotes/origin/integration/replit-preview)"
          echo "SOURCE_SHA=${{ inputs.source_ref }}"
          echo "PREVIEW_SHA=$final_sha"
          echo "Use PREVIEW_SHA as the expected commit when refreshing Replit."
