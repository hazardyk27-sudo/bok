name: Blackjack Empty Betting Unlock Patch V2

on:
  push:
    branches:
      - fix/blackjack-continuous-seat-join-20261004

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/blackjack-continuous-seat-join-20261004
          fetch-depth: 0
      - name: Apply focused Blackjack patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          flow = Path('artifacts/api-server/src/blackjack/roundFlow.ts')
          text = flow.read_text()

          marker = 'export function closeBlackjackBettingWindow(input: {\n'
          helper = '''function reopenEmptyBlackjackBettingWindow(input: {
  table: BlackjackTable;
  accounts: readonly BlackjackRoundFlowAccount[];
  positions: readonly BlackjackBettingPosition[];
  nowMs: number;
}): BlackjackBettingWindowCloseResult {
  const round=input.table.round;
  if(
    round===null ||
    (round.phase!=="BETTING" && round.phase!=="BETTING_LOCKED") ||
    round.bettingClosesAtMs===null
  ){
    throw new Error(
      "Blackjack empty betting recovery requires a closed betting round",
    );
  }

  const bettingWindowMs=round.bettingClosesAtMs-round.startedAtMs;
  if(!Number.isSafeInteger(bettingWindowMs) || bettingWindowMs<=0){
    throw new RangeError(
      "Blackjack empty betting recovery window is invalid",
    );
  }
  const nextRoundNumber=round.roundNumber+1;
  if(!Number.isSafeInteger(nextRoundNumber) || nextRoundNumber<1){
    throw new RangeError(
      "Blackjack empty betting recovery roundNumber cannot advance safely",
    );
  }
  const bettingClosesAtMs=input.nowMs+bettingWindowMs;
  if(!Number.isSafeInteger(bettingClosesAtMs)){
    throw new RangeError(
      "Blackjack empty betting recovery deadline exceeds safe integer range",
    );
  }

  const reopenedRound=Object.freeze({
    ...round,
    roundId:input.table.tableId+":round-"+nextRoundNumber,
    roundNumber:nextRoundNumber,
    phase:"BETTING" as const,
    activeSeatOrder:Object.freeze([]),
    hands:Object.freeze([]),
    dealer:Object.freeze({
      cards:Object.freeze([]),
      holeCardRevealed:false,
    }),
    currentTurn:null,
    startedAtMs:input.nowMs,
    bettingClosesAtMs,
    finishedAtMs:null,
  });
  const players=Object.freeze(
    input.table.players.map((player): BlackjackPlayer =>
      player.status==="DISCONNECTED"
        ? player
        : Object.freeze({
            ...player,
            status:"BETTING" as const,
            handIds:Object.freeze([]),
          }),
    ),
  );
  const reopened=commitBlackjackServerEvent(
    Object.freeze({
      ...input.table,
      phase:"BETTING" as const,
      round:reopenedRound,
      players,
      stateVersion:nextStateVersion(input.table.stateVersion),
    }),
    {
      type:"ROUND_PHASE_CHANGED",
      actionId:null,
      createdAtMs:input.nowMs,
    },
  ).table;

  return Object.freeze({
    table:reopened,
    accounts:Object.freeze([...input.accounts]),
    positions:Object.freeze(
      input.positions.filter(
        (position)=>position.roundId!==round.roundId,
      ),
    ),
    participants:Object.freeze([]),
    replayed:false,
  });
}

'''
          assert text.count(marker) == 1
          text = text.replace(marker, helper + marker, 1)

          old_locked = '''  if (
    input.table.phase === "BETTING_LOCKED" &&
    round.phase === "BETTING_LOCKED"
  ) {
    return Object.freeze({
      table:input.table,
      accounts:Object.freeze([...input.accounts]),
      positions:Object.freeze([...input.positions]),
      participants:currentLockedParticipants(round.roundId,input.positions),
      replayed:true,
    });
  }
'''
          new_locked = '''  if (
    input.table.phase === "BETTING_LOCKED" &&
    round.phase === "BETTING_LOCKED"
  ) {
    const participants=currentLockedParticipants(
      round.roundId,
      input.positions,
    );
    if(participants.length===0){
      return reopenEmptyBlackjackBettingWindow({
        table:input.table,
        accounts:input.accounts,
        positions:input.positions,
        nowMs:input.nowMs,
      });
    }
    return Object.freeze({
      table:input.table,
      accounts:Object.freeze([...input.accounts]),
      positions:Object.freeze([...input.positions]),
      participants,
      replayed:true,
    });
  }
'''
          assert text.count(old_locked) == 1
          text = text.replace(old_locked, new_locked, 1)

          players_marker = '''  const players=Object.freeze(
    input.table.players.map((player): BlackjackPlayer => {
      if(player.status==="DISCONNECTED") return player;
      if(readyPlayerIds.has(player.playerId)){
'''
          empty_reopen = '''  if(readyPlayerIds.size===0){
    return reopenEmptyBlackjackBettingWindow({
      table:input.table,
      accounts:Object.freeze(
        input.accounts.map((account)=>
          accountsByPlayer.get(account.playerId) ?? account,
        ),
      ),
      positions:Object.freeze([...nextPositions]),
      nowMs:input.nowMs,
    });
  }

'''
          assert text.count(players_marker) == 1
          text = text.replace(players_marker, empty_reopen + players_marker, 1)
          flow.write_text(text)

          runtime = Path('artifacts/api-server/src/blackjack/roundRuntime.ts')
          text = runtime.read_text()
          old_type = 'export type BlackjackRoundRuntimeTransitionType =\n  | "BETTING_LOCKED"\n'
          new_type = 'export type BlackjackRoundRuntimeTransitionType =\n  | "BETTING_LOCKED"\n  | "BETTING_REOPENED"\n'
          assert text.count(old_type) == 1
          text = text.replace(old_type, new_type, 1)

          old_start_locked = '''  const locked = await coordinator.closeBettingWindow(nowMs);
  if (locked.participants.length === 0) {
    return finish(
      "BETTING_CLOSED_EMPTY",
      coordinator.getTable(),
      transitions,
    );
  }
'''
          new_start_locked = '''  const locked = await coordinator.closeBettingWindow(nowMs);
  if(!locked.replayed && locked.table.phase==="BETTING"){
    transitions.push(
      freezeTransition("BETTING_REOPENED",locked.table),
    );
  }
  if (locked.participants.length === 0) {
    return finish(
      "BETTING_CLOSED_EMPTY",
      coordinator.getTable(),
      transitions,
    );
  }
'''
          assert text.count(old_start_locked) == 1
          text = text.replace(old_start_locked, new_start_locked, 1)

          old_transition = '''    if (!closed.replayed) {
      transitions.push(
        freezeTransition("BETTING_LOCKED", closed.table),
      );
    }
'''
          new_transition = '''    if (!closed.replayed) {
      transitions.push(
        freezeTransition(
          closed.table.phase==="BETTING"
            ? "BETTING_REOPENED"
            : "BETTING_LOCKED",
          closed.table,
        ),
      );
    }
'''
          assert text.count(old_transition) == 1
          text = text.replace(old_transition, new_transition, 1)
          runtime.write_text(text)

          test = Path('artifacts/api-server/src/blackjack/roundRuntime.test.ts')
          text = test.read_text()
          old_test = '''  it("closes an empty betting window once and does not attempt an initial deal",async()=>{
    const game=coordinator();

    const tick=await runBlackjackRoundRuntimeTick(game,{nowMs:10_000});

    expect(tick.status).toBe("BETTING_CLOSED_EMPTY");
    expect(tick.transitions.map((transition)=>transition.type)).toEqual([
      "BETTING_LOCKED",
    ]);
    expect(game.getTable().phase).toBe("BETTING_LOCKED");
    expect(game.getTable().shoe.nextIndex).toBe(0);

    const replay=await runBlackjackRoundRuntimeTick(game,{nowMs:10_001});
    expect(replay.status).toBe("BETTING_CLOSED_EMPTY");
    expect(replay.transitions).toEqual([]);
    expect(game.getTable().stateVersion).toBe(1);
    expect(game.getTable().eventSequence).toBe(1);
  });
'''
          new_test = '''  it("reopens betting after an empty window instead of locking the table",async()=>{
    const game=coordinator();

    const tick=await runBlackjackRoundRuntimeTick(game,{nowMs:10_000});

    expect(tick.status).toBe("BETTING_CLOSED_EMPTY");
    expect(tick.transitions.map((transition)=>transition.type)).toEqual([
      "BETTING_REOPENED",
    ]);
    expect(game.getTable()).toMatchObject({
      phase:"BETTING",
      stateVersion:1,
      eventSequence:1,
      round:{
        roundId:"round-runtime-table:round-2",
        roundNumber:2,
        phase:"BETTING",
        startedAtMs:10_000,
        bettingClosesAtMs:20_000,
      },
    });
    expect(game.getTable().players[0]?.status).toBe("BETTING");
    expect(game.getTable().shoe.nextIndex).toBe(0);

    const replay=await runBlackjackRoundRuntimeTick(game,{nowMs:10_001});
    expect(replay.status).toBe("WAITING_FOR_BETTING_DEADLINE");
    expect(replay.transitions).toEqual([]);
    expect(game.getTable().stateVersion).toBe(1);
    expect(game.getTable().eventSequence).toBe(1);
  });
'''
          assert text.count(old_test) == 1
          text = text.replace(old_test, new_test, 1)

          recovery_test = '''
  it("self-heals a recovered legacy empty BETTING_LOCKED snapshot",async()=>{
    const source=bettingTable();
    if(source.round===null) throw new Error("locked recovery round missing");
    const game=new BlackjackPlayerActionCoordinator({
      table:{
        ...source,
        phase:"BETTING_LOCKED",
        players:source.players.map((player)=>({
          ...player,
          status:"SEATED_WAITING" as const,
        })),
        round:{
          ...source.round,
          phase:"BETTING_LOCKED",
        },
      },
      accounts:[{
        playerId:"player-2",
        userId:"user-2",
        wallet:createBlackjackWalletLedgerState({
          userId:"user-2",
          totalBalanceCents:100_000,
        }),
        book:createBlackjackReservationBook("user-2"),
      }],
      bettingLimits:{minBetCents:1_000,maxBetCents:null},
    });

    const tick=await runBlackjackRoundRuntimeTick(game,{nowMs:10_001});

    expect(tick.status).toBe("BETTING_CLOSED_EMPTY");
    expect(tick.transitions.map((transition)=>transition.type)).toEqual([
      "BETTING_REOPENED",
    ]);
    expect(game.getTable()).toMatchObject({
      phase:"BETTING",
      stateVersion:1,
      eventSequence:1,
      round:{
        roundId:"round-runtime-table:round-2",
        roundNumber:2,
        phase:"BETTING",
        startedAtMs:10_001,
        bettingClosesAtMs:20_001,
      },
    });
    expect(game.getTable().players[0]?.status).toBe("BETTING");
  });
'''
          assert text.count(new_test) == 1
          text = text.replace(new_test, new_test + recovery_test, 1)
          test.write_text(text)

          for workflow in [
            Path('.github/workflows/blackjack-empty-betting-unlock-patch.yml'),
            Path('.github/workflows/blackjack-empty-betting-unlock-patch-v2.yml'),
          ]:
            if workflow.exists(): workflow.unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(blackjack): reopen empty betting windows"
          git push origin HEAD:fix/blackjack-continuous-seat-join-20261004
