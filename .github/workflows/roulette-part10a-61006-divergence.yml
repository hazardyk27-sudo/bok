name: Roulette Part 10A Seed 61006 Divergence

on:
  push:
    branches:
      - feature/roulette
    paths:
      - '.github/workflows/roulette-part10a-61006-divergence.yml'
      - 'artifacts/roulette-physics-lab/src/Part2SceneViewport.tsx'
      - 'artifacts/api-server/src/physics-lab/simulation.ts'
      - 'artifacts/roulette-physics-lab/scripts/part10a-compare.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build TypeScript project references
        run: pnpm run typecheck:libs

      - name: Typecheck physics runtimes
        run: |
          pnpm --filter @workspace/roulette-physics-lab run typecheck
          pnpm --filter @workspace/api-server run typecheck

      - name: Start roulette physics lab
        run: |
          PORT=4173 BASE_PATH=/ pnpm --filter @workspace/roulette-physics-lab run dev > /tmp/roulette-part10a-vite.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/roulette-part10a-vite.log
          exit 1

      - name: Run browser seed 61006
        shell: bash
        run: |
          set -euo pipefail
          ROULETTE_LAB_URL="http://127.0.0.1:4173/?part6Headless=1&part6SeedStartIndex=5&part6SeedCount=1&part6MaxDurationSeconds=30&part10aTrace61006=1" \
          ROULETTE_PART6_OUTPUT="artifacts/roulette-physics-lab/part10a-browser-61006.json" \
          ROULETTE_PART6_TIMEOUT_MS='180000' \
          ROULETTE_PART6_EXPECTED_SEEDS='1' \
          node scripts/roulette-part6-runtime.mjs > part10a-browser-61006.log 2>&1

      - name: Run server seed 61006
        shell: bash
        run: |
          set -euo pipefail
          ROULETTE_PART10A_TRACE_61006=1 \
          pnpm --filter @workspace/api-server exec tsx -e \
            "(async()=>{const fs=await import('node:fs');const {simulatePhysicsLabRound}=await import('./src/physics-lab/simulation.ts');const r=await simulatePhysicsLabRound('part10a-61006','61006');fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/part10a-server-result-61006.json',JSON.stringify({status:r.status,errorCode:r.errorCode,finalPocketIndex:r.finalPocketIndex,finalPocketNumber:r.finalPocketNumber,stableSettleStep:r.stableSettleStep,startConditions:r.startConditions,trajectory:r.trajectory},null,2));console.log('SERVER_PART10A_RESULT '+JSON.stringify({status:r.status,errorCode:r.errorCode,finalPocketIndex:r.finalPocketIndex,finalPocketNumber:r.finalPocketNumber,stableSettleStep:r.stableSettleStep,trajectorySamples:r.trajectory.length}));})().catch(error=>{console.error(error);process.exit(1)})" \
            > part10a-server-61006.log 2>&1

      - name: Compare browser and server
        run: |
          node artifacts/roulette-physics-lab/scripts/part10a-compare.mjs \
            part10a-browser-61006.log \
            part10a-server-61006.log \
            artifacts/roulette-physics-lab/part10a-browser-61006.json \
            part10a-server-result-61006.json \
            part10a-61006-divergence-summary.json

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roulette-part10a-61006-divergence
          path: |
            artifacts/roulette-physics-lab/part10a-browser-61006.json
            part10a-browser-61006.log
            part10a-server-61006.log
            part10a-server-result-61006.json
            part10a-61006-divergence-summary.json
            /tmp/roulette-part10a-vite.log
          if-no-files-found: error
