name: Blackjack Empty Betting Unlock Patch V3

on:
  push:
    branches:
      - fix/blackjack-continuous-seat-join-20261004

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/blackjack-continuous-seat-join-20261004
          fetch-depth: 0
      - name: Apply focused Blackjack patch
        shell: bash
        run: |
          python3 -c "import base64; exec(base64.b64decode(''))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(blackjack): reopen empty betting windows"
          git push origin HEAD:fix/blackjack-continuous-seat-join-20261004
