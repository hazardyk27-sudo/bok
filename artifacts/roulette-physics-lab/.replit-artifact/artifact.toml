kind = "web"
previewPath = "/physics-lab/"
title = "Roulette Physics Lab"
description = "An isolated Three.js laboratory for inspecting the supplied roulette visual asset before any rigid-body physics is connected to the live roulette experience."
version = "1.0.0"
id = "artifacts/roulette-physics-lab"
router = "path"

[[services]]
name = "web"
paths = [ "/physics-lab/" ]
localPort = 18084

[services.development]
run = "pnpm --filter @workspace/roulette-physics-lab run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/roulette-physics-lab", "run", "build" ]
serve = "static"
publicDir = "artifacts/roulette-physics-lab/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18084"
BASE_PATH = "/physics-lab/"
